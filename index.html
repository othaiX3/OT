   ⚠️ ວາງ LOGO ຂອງເຈົ້າຢູ່ນີ້ບ່ອນດຽວ (copy ຄ່າ base64 ຈາກໄຟລ໌ເກົ່າ)
   ຮູບແບບ:  const LOGO="data:image/png;base64,/9j/4AAQ...";
   ຖ້າປະຫວ່າງໄວ້ ລະບົບຈະໃຊ້ຕາສັນຍາລັກ LDB ແທນອັດຕະໂນມັດ

const LOGO="";

const C={

  amber:"#F9A825", red:"#D32F2F", W:"#fff", card:"#fff"

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const toM=t=>{if(!t)return 0;const[h,m]=t.split(":").map(Number);return h*60+(m||0)};
const toS=m=>{if(!m||m<=0)return"";const h=Math.floor(m/60),n=Math.round(m%60);return`${h}:${n.toString().padStart(2,"0")}`};

/*
  4 ຊ່ວງ OT:
  [0] 17:30–22:00  → ທຸກວັນ
  [1] 22:00–06:00  → ທຸກວັນ
  [2] 08:00–12:00  → ເສົາ–ອາທິດ ເທົ່ານັ້ນ
  [3] 12:00–16:00  → ເສົາ–ອາທິດ ເທົ່ານັ້ນ
*/
const BANDS=[
  {l:"17:30–22:00", s:17*60+30, e:22*60,      wk:true,  we:true },
  {l:"22:00–06:00", s:22*60,    e:24*60+6*60, wk:true,  we:true },
  {l:"08:00–12:00", s:8*60,     e:12*60,      wk:false, we:true },
  {l:"12:00–16:00", s:12*60,    e:16*60,      wk:false, we:true },
];

const isWE=d=>[0,6].includes(new Date(d).getDay());

function calcBands(s0,e0,dateStr){
  if(!s0||!e0)return[0,0,0,0];
  const we=dateStr?isWE(dateStr):false;
  const es=we?"08:00":s0;
  const s=toM(es);let e=toM(e0);
  if(e<s && e<12*60 && (s>=12*60 || we)) e+=1440;
  return BANDS.map(b=>{
    if(we?!b.we:!b.wk)return 0;
    const o1=Math.max(0,Math.min(e,b.e)-Math.max(s,b.s));
    const o2=Math.max(0,Math.min(e,b.e+1440)-Math.max(s,b.s+1440));
    return o1+o2;
  });
}

const DAYS=["ອາທິດ","ຈັນ","ອັງຄານ","ພຸດ","ພະຫັດ","ສຸກ","ເສົາ"];
const MONTHS=["ມັງກອນ","ກຸມພາ","ມີນາ","ເມສາ","ພຶດສະພາ","ມິຖຸນາ","ກໍລະກົດ","ສິງຫາ","ກັນຍາ","ຕຸລາ","ພະຈິກ","ທັນວາ"];
const dayL=d=>DAYS[new Date(d).getDay()];
const fmtD=d=>{const t=new Date(d);return`${t.getDate()}/${t.getMonth()+1}/${t.getFullYear()}`};
const fmtLong=d=>{const t=new Date(d);return`${t.getDate()} ${MONTHS[t.getMonth()]}`};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* ── ເປີດປະຕິທິນ/ໂມງ ເມື່ອກົດບ່ອນໃດກໍໄດ້ໃນຊ່ອງ ── */
const openPicker=el=>{
  if(!el)return;
  if(typeof el.showPicker==="function"){ try{el.showPicker();}catch(e){} return; }
  el.focus();
};

async function exportXL(emp,all,startDate,endDate){
  const rows=(all[emp.id]||[])
    .filter(e=>e.date>=startDate&&e.date<=endDate)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("OT");

  ws.columns=[
    {width:13},{width:9},{width:10},{width:10},{width:10},
    {width:13},{width:13},{width:13},{width:13},{width:18}
  ];

  const thin={style:"thin",color:{argb:"FF000000"}};
  const bd={top:thin,bottom:thin,left:thin,right:thin};

  const hr=ws.addRow([]);hr.height=32;
  ["ວັນທີ","ວັນ","ເລີ່ມ OT","ກົດເຂົ້າ","ອອກ",
   "17:30-22:00","22:00-06:00","08:00-12:00 (ສ/ອ)","12:00-16:00 (ສ/ອ)","ໝາຍເຫດ"]
  .forEach((h,i)=>{
    const c=hr.getCell(i+1);
    c.value=h;
    c.font={name:"Phetsarath OT",bold:true,size:10};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
    c.alignment={horizontal:"center",vertical:"middle",wrapText:true};
    c.border=bd;
  });

  const tb=[0,0,0,0];
  rows.forEach(r=>{
    const we=isWE(r.date);
    const b=calcBands(r.startTime||"17:30",r.endTime,r.date);
    b.forEach((x,i)=>tb[i]+=x);
    const dr=ws.addRow([]);dr.height=18;
    [
      [fmtD(r.date),"left"],
      [dayL(r.date),"center"],
      [we?"08:00":(r.startTime||"17:30"),"center"],
      [r.clockIn||"—","center"],
      [r.endTime||"—","center"],
      [b[0]>0?toS(b[0]):"—","center",true],
      [b[1]>0?toS(b[1]):"—","center",true],
      [we?(b[2]>0?toS(b[2]):"—"):"—","center"],
      [we?(b[3]>0?toS(b[3]):"—"):"—","center"],
      [r.remarks||"","left"]
    ].forEach(([v,al,bold],i)=>{
      const c=dr.getCell(i+1);
      c.value=v;
      c.font={name:"Phetsarath OT",bold:!!bold,size:10};
      c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
      c.alignment={horizontal:al,vertical:"middle"};
      c.border=bd;
    });
  });

  const tr=ws.addRow([]);tr.height=20;
  ws.mergeCells(tr.number,1,tr.number,5);
  [tb[0]>0?toS(tb[0]):"—",tb[1]>0?toS(tb[1]):"—",
   tb[2]>0?toS(tb[2]):"—",tb[3]>0?toS(tb[3]):"—",""]
  .forEach((v,i)=>{
    const c=tr.getCell(i+6);
    c.value=v;
    c.font={name:"Phetsarath OT",bold:true,size:10};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
    c.alignment={horizontal:"center",vertical:"middle"};
    c.border=bd;
  });
  const lbl=tr.getCell(1);
  lbl.value="ລວມທັງໝົດ";
  lbl.font={name:"Phetsarath OT",bold:true,size:10};
  lbl.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
  lbl.alignment={horizontal:"center",vertical:"middle"};
  lbl.border=bd;

  const buf=await wb.xlsx.writeBuffer();
  const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  const a=document.createElement("a");a.href=url;
  a.download=`OT_${emp.name}_${startDate}_${endDate}.xlsx`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function BootScreen({pct,msg,done}){
  const R=54, CIR=2*Math.PI*R;
  return(
    <div style={{position:"fixed",inset:0,zIndex:9000,display:"flex",flexDirection:"column",
      alignItems:"center",justifyContent:"center",gap:0,
      background:`radial-gradient(120% 90% at 50% 0%,#1E88E5 0%,#124B95 45%,#0B2F60 100%)`,

      <div style={{position:"absolute",width:460,height:460,borderRadius:"50%",bottom:"-16%",right:"-10%",

      {/* ວົງແຫວນ + ໂລໂກ້ */}
      <div style={{position:"relative",width:140,height:140,display:"flex",alignItems:"center",justifyContent:"center",zIndex:2}}>
        <svg width="140" height="140" style={{position:"absolute",transform:"rotate(-90deg)"}}>
          <circle cx="70" cy="70" r={R} fill="none" stroke="rgba(255,255,255,.16)" strokeWidth="3"/>
          <circle cx="70" cy="70" r={R} fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round"
            strokeDasharray={CIR} strokeDashoffset={CIR-(CIR*Math.min(pct,100)/100)}
            style={{transition:"stroke-dashoffset .5s cubic-bezier(.3,.9,.3,1)",filter:"drop-shadow(0 0 6px rgba(255,255,255,.5))"}}/>
        </svg>
        <svg width="140" height="140" style={{position:"absolute",animation:"spin 9s linear infinite",opacity:.5}}>

        <div style={{animation:"pop .6s cubic-bezier(.22,.9,.3,1) both"}}><Logo size={78} ring/></div>

      <div style={{textAlign:"center",marginTop:26,zIndex:2,padding:"0 24px"}}>
        <div style={{color:"#fff",fontSize:19,fontWeight:700,letterSpacing:.3,animation:"rise .5s .12s both"}}>ລະບົບບັນທຶກຊົ່ວໂມງ OT</div>
        <div style={{color:"rgba(255,255,255,.72)",fontSize:12.5,marginTop:5,animation:"rise .5s .2s both"}}>ທະນາຄານພັດທະນາລາວ · ສາຂາໂພນສະຫວັນ</div>
      </div>

      {/* ແຖບຄວາມຄືບໜ້າ */}
      <div style={{width:"min(300px,72vw)",marginTop:30,zIndex:2,animation:"rise .5s .28s both"}}>
        <div style={{height:5,borderRadius:99,background:"rgba(255,255,255,.16)",overflow:"hidden"}}>
          <div style={{height:"100%",width:`${pct}%`,borderRadius:99,
            background:"linear-gradient(90deg,#BBDEFB,#fff)",
            transition:"width .5s cubic-bezier(.3,.9,.3,1)",boxShadow:"0 0 10px rgba(255,255,255,.6)"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:9,color:"rgba(255,255,255,.8)",fontSize:11.5}}>
          <span style={{display:"flex",alignItems:"center",gap:6}}>
            {pct<100?<Spin sz={12} c="#fff" w={2.6}/>:<IOk sz={13} c="#A5D6A7"/>}{msg}
          </span>
          <span style={{fontVariantNumeric:"tabular-nums",fontWeight:600}}>{Math.round(pct)}%</span>
        </div>
      </div>

  );
}

/* ── ແຖບໂຫຼດບາງໆເທິງສຸດ ── */
const TopLoader=({on})=>on?(
  <div style={{position:"fixed",top:0,left:0,right:0,height:3,zIndex:8000,background:"rgba(21,101,192,.12)",overflow:"hidden"}}>
    <div style={{position:"absolute",top:0,height:"100%",width:"45%",borderRadius:99,
      background:"linear-gradient(90deg,transparent,#1E88E5,#0D3B78,transparent)",animation:"glide 1.05s ease-in-out infinite"}}/>
  </div>
):null;

/* ── Toast ── */
function Toasts({items,onClose}){
  return(
    <div style={{position:"fixed",top:14,left:"50%",transform:"translateX(-50%)",zIndex:9500,
      display:"flex",flexDirection:"column",gap:8,alignItems:"center",width:"max-content",maxWidth:"92vw"}}>
      {items.map(t=>{
        const ok=t.type==="ok", warn=t.type==="err";
        const bg=ok?"#0E7A3C":warn?"#C62828":"#1565C0";
        return(
          <div key={t.id} onClick={()=>onClose(t.id)} style={{
            background:bg,color:"#fff",borderRadius:11,padding:"10px 15px",fontSize:12.5,fontWeight:500,
            boxShadow:"0 10px 26px rgba(13,59,120,.28)",display:"flex",alignItems:"center",gap:9,
            cursor:"pointer",position:"relative",overflow:"hidden",animation:"toastIn .3s cubic-bezier(.22,.9,.3,1) both"}}>
            {ok?<IOk sz={15}/>:warn?<IWarn sz={15}/>:<Spin sz={14}/>}
            <span>{t.msg}</span>
            <div style={{position:"absolute",left:0,bottom:0,height:2.5,background:"rgba(255,255,255,.55)",
              animation:"tick 3.2s linear forwards"}}/>
          </div>
        );
      })}
    </div>
  );
}

/* ── ຊ່ອງເລືອກວັນທີ / ເວລາ: ກົດບ່ອນໃດກໍໄດ້ພາຍໃນຊ່ອງ ── */
function PickField({type="date",value,onChange,label,icon,accent,disabled,compact}){
  const ref=useRef(null);
  const cl=()=>{ if(!disabled) openPicker(ref.current); };
  return(
    <div className="pick" onClick={cl} role="button" tabIndex={-1}
      style={{background:disabled?"#F2F5F9":"#F7FAFE",border:`1.5px solid ${accent?C.blue:C.line}`,
        borderRadius:10,padding:compact?"7px 10px":"9px 12px",display:"flex",flexDirection:"column",gap:3,
        opacity:disabled?.7:1,flex:1,minWidth:0}}>
      {label&&<span style={{fontSize:10.5,color:C.muted,fontWeight:600,letterSpacing:.2,pointerEvents:"none"}}>{label}</span>}
      <div style={{display:"flex",alignItems:"center",gap:8,pointerEvents:"none"}}>
        <span style={{color:accent?C.blue:C.muted,display:"flex",flexShrink:0}}>{icon||(type==="date"?<ICal sz={14}/>:<IClock sz={14}/>)}</span>
        <input ref={ref} type={type} value={value||""} disabled={disabled}
          onChange={onChange} style={{fontSize:compact?13:13.5,pointerEvents:"auto"}}/>
      </div>
    </div>
  );
}

/* ══════════════════════ APP ══════════════════════ */
function App(){
  const[emps]=useState(()=>{
    try{
      const v=localStorage.getItem("ldb_ver");
      if(v!=="v2") return INIT;
      return JSON.parse(localStorage.getItem("ldb_emps"))||INIT;
    }catch(e){return INIT}
  });
  const[entries,setEntries]=useState({});
  const[sel,setSel]=useState("1");

  /* ງວດ: 21 ເດືອນກ່ອນ → 20 ເດືອນນີ້ */
  constPERIOD=(()=>{
    const d=new Date();
    const base=d.getDate()>20
      ? {s:new Date(d.getFullYear(),d.getMonth(),21),   e:new Date(d.getFullYear(),d.getMonth()+1,20)}
      : {s:new Date(d.getFullYear(),d.getMonth()-1,21), e:new Date(d.getFullYear(),d.getMonth(),20)};
    return{start:iso(base.s),end:iso(base.e)};
  })();
  const[startDate,setStartDate]=useState(PERIOD.start);
  const[endDate,setEndDate]=useState(PERIOD.end);

  const[showAdd,setShowAdd]=useState(false);
  const[form,setForm]=useState({date:"",startTime:"17:30",clockIn:"",clockOut:"",endTime:"",remarks:""});
  const[sideOpen,setSideOpen]=useState(false);
  const[editId,setEditId]=useState(null);
  const[editForm,setEditForm]=useState({date:"",startTime:"",clockIn:"",clockOut:"",endTime:"",remarks:""});
  const[confirmId,setConfirmId]=useState(null);
  const[isMob,setIsMob]=useState(window.innerWidth<640);

  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[deleting,setDeleting]=useState(false);
  const[exporting,setExporting]=useState(false);
  const[refreshing,setRefreshing]=useState(false);

  /* ໜ້າ boot */
  const[boot,setBoot]=useState({pct:6,msg:"ກຳລັງເລີ່ມລະບົບ..."});
  const[bootDone,setBootDone]=useState(false);
  const[bootGone,setBootGone]=useState(false);

  /* toast */
  const[toasts,setToasts]=useState([]);
  const toast=useCallback((msg,type="ok")=>{
    const id=Math.random().toString(36).slice(2);
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3200);
  },[]);
  const closeToast=id=>setToasts(t=>t.filter(x=>x.id!==id));

  useEffect(()=>{const h=()=>setIsMob(window.innerWidth<640);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);
  useEffect(()=>{ if(localStorage.getItem("ldb_ver")!=="v2") localStorage.setItem("ldb_ver","v2"); },[]);

  /* ── ດຶງຂໍ້ມູນ ── */
  const loadAll=useCallback(async(silent)=>{
    if(!silent) setRefreshing(true);
    try{
      const{data,error}=await SUPA.from("ot_entries").select("*");
      if(error) throw error;
      const map={};
      (data||[]).forEach(r=>{
        if(!map[r.emp_id]) map[r.emp_id]=[];
        map[r.emp_id].push(rowToEntry(r));
      });
      Object.keys(map).forEach(id=>map[id].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0));
      setEntries(map);
      return true;
    }catch(e){
      console.error("load error",e);
      return false;
    }finally{ setLoading(false); setRefreshing(false); }
  },[]);

  /* ── ລຳດັບການເປີດເວັບ ── */
  useEffect(()=>{
    let alive=true;
    (async()=>{
      setBoot({pct:14,msg:"ກຳລັງເລີ່ມລະບົບ..."});      await sleep(260);
      if(!alive)return;
      setBoot({pct:40,msg:"ເຊື່ອມຕໍ່ຖານຂໍ້ມູນ..."});     await sleep(180);
      const ok=await loadAll(true);
      if(!alive)return;
      setBoot({pct:82,msg:ok?"ຈັດຮຽງລາຍການ OT...":"ເຊື່ອມຕໍ່ບໍ່ໄດ້ — ກຳລັງລອງໃໝ່"}); await sleep(320);
      if(!alive)return;
      setBoot({pct:100,msg:ok?"ພ້ອມໃຊ້ງານ":"ເປີດແບບອອບລາຍ"}); await sleep(420);
      if(!alive)return;
      setBootDone(true);
      await sleep(560);
      if(!alive)return;
      setBootGone(true);
      if(!ok) toast("ເຊື່ອມຕໍ່ຖານຂໍ້ມູນບໍ່ໄດ້ — ກວດອິນເຕີເນັດແລ້ວກົດໂຫຼດຄືນ","err");
    })();

    const channel=SUPA.channel("ot_realtime")
      .on("postgres_changes",{event:"*",schema:"public",table:"ot_entries"},()=>loadAll(true))
      .subscribe();
    return()=>{alive=false;SUPA.removeChannel(channel);};
  },[loadAll,toast]);

  const emp=emps.find(e=>e.id===sel);
  const list=(entries[sel]||[])
    .filter(e=>e.date>=startDate&&e.date<=endDate)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

  /* ── ບັນທຶກ ── */
  const saveEntry=async()=>{
    if(!form.date||!form.startTime||!form.endTime){toast("ຕື່ມວັນທີ ແລະ ເວລາກົດອອກກ່ອນ","err");return;}
    setSaving(true);
    const entry={...form,id:Date.now()+""};
    setEntries(p=>({...p,[sel]:[...(p[sel]||[]),entry]}));
    try{
      const{error}=await SUPA.from("ot_entries").insert(entryToRow(sel,entry));
      if(error) throw error;
      setForm({date:"",startTime:"17:30",clockIn:"",clockOut:"",endTime:"",remarks:""});
      setShowAdd(false);
      toast("ບັນທຶກ OT ແລ້ວ");
    }catch(e){
      console.error("save error",e);
      setEntries(p=>({...p,[sel]:(p[sel]||[]).filter(x=>x.id!==entry.id)}));
      toast("ບັນທຶກບໍ່ສຳເລັດ — ກວດການເຊື່ອມຕໍ່","err");
    }finally{setSaving(false);}
  };

  const del=async(id)=>{
    setDeleting(true);
    const backup=entries[sel]||[];
    setEntries(p=>({...p,[sel]:(p[sel]||[]).filter(e=>e.id!==id)}));
    try{
      const{error}=await SUPA.from("ot_entries").delete().eq("id",id);
      if(error) throw error;
      setConfirmId(null);
      toast("ລົບລາຍການແລ້ວ");
    }catch(e){
      console.error("delete error",e);
      setEntries(p=>({...p,[sel]:backup}));
      toast("ລົບບໍ່ສຳເລັດ — ລອງໃໝ່ອີກຄັ້ງ","err");
    }finally{setDeleting(false);}
  };

  const openEdit=r=>{setEditId(r.id);setEditForm({date:r.date,startTime:r.startTime,clockIn:r.clockIn||"",clockOut:r.clockOut||"",endTime:r.endTime,remarks:r.remarks||""});};

  const saveEdit=async()=>{
    if(!editForm.date||!editForm.endTime){toast("ຕື່ມວັນທີ ແລະ ເວລາກົດອອກກ່ອນ","err");return;}
    setSaving(true);
    const backup=entries[sel]||[];
    setEntries(p=>({...p,[sel]:(p[sel]||[]).map(e=>e.id===editId?{...e,...editForm}:e)}));
    try{
      const{error}=await SUPA.from("ot_entries").update({
        date:editForm.date,
        start_time:editForm.startTime,
        clock_in:editForm.clockIn||null,
        end_time:editForm.endTime,
        remarks:editForm.remarks
      }).eq("id",editId);
      if(error) throw error;
      setEditId(null);
      toast("ແກ້ໄຂແລ້ວ");
    }catch(e){
      console.error("edit error",e);
      setEntries(p=>({...p,[sel]:backup}));
      toast("ແກ້ໄຂບໍ່ສຳເລັດ","err");
    }finally{setSaving(false);}
  };

  const doExport=async()=>{
    if(!emp||exporting)return;
    setExporting(true);
    try{ await exportXL(emp,entries,startDate,endDate); toast("ດາວໂຫຼດ Excel ແລ້ວ"); }
    catch(e){ console.error(e); toast("ສ້າງໄຟລ໌ Excel ບໍ່ສຳເລັດ","err"); }
    finally{ setExporting(false); }
  };

  const shiftPeriod=dir=>{
    const s=new Date(startDate), e=new Date(endDate);
    s.setMonth(s.getMonth()+dir); e.setMonth(e.getMonth()+dir);
    setStartDate(iso(s)); setEndDate(iso(e));
  };
  const thisPeriod=()=>{ setStartDate(PERIOD.start); setEndDate(PERIOD.end); };

  const btot=[0,0,0,0];let tmins=0;
  list.forEach(r=>{
    const b=calcBands(r.startTime,r.endTime,r.date);
    tmins+=b.reduce((a,x)=>a+x,0);
    b.forEach((x,i)=>btot[i]+=x);
  });

  const pb=calcBands(form.startTime,form.endTime,form.date);
  const pt=pb.reduce((a,b)=>a+b,0);
  const formWE=form.date?isWE(form.date):false;
  const moCount=id=>(entries[id]||[]).filter(e=>e.date>=startDate&&e.date<=endDate).length;
  const moMins=id=>(entries[id]||[]).filter(e=>e.date>=startDate&&e.date<=endDate)
      .reduce((a,r)=>a+calcBands(r.startTime,r.endTime,r.date).reduce((x,y)=>x+y,0),0);

  const TH=({ch,center,green})=>(
    <th style={{padding:"10px 9px",textAlign:center?"center":"left",whiteSpace:"nowrap",
      background:green?"#1B6E3C":"#134C8F",color:"#fff",fontWeight:600,fontSize:11,
      position:"sticky",top:0,zIndex:2,
      borderRight:"1px solid rgba(255,255,255,.14)"}}>
      {ch}
    </th>
  );

  const bandCell=(val,active,isWEcol,rowBg)=>(
    <td style={{padding:"8px",
      background:active?(isWEcol?"#D6F0D8":"#D6E8FB"):rowBg,
      borderBottom:`1px solid ${C.line}`,borderRight:`1px solid ${C.line}`,
      textAlign:"center",fontVariantNumeric:"tabular-nums",
      color:active?(isWEcol?"#155724":"#0D3B78"):"#C3D0DE",
      fontWeight:active?700:400,fontSize:11.5}}>
      {active?toS(val):"—"}
    </td>
  );

  /* ══════════════════════ RENDER ══════════════════════ */
  return(
    <div style={{display:"flex",height:"100vh",background:"var(--bg)",overflow:"hidden"}}>

      <TopLoader on={saving||deleting||refreshing||exporting}/>
      <Toasts items={toasts} onClose={closeToast}/>
      {!bootGone && <BootScreen pct={boot.pct} msg={boot.msg} done={bootDone}/>}

      {isMob&&sideOpen&&(
        <div onClick={()=>setSideOpen(false)} style={{position:"fixed",inset:0,background:"rgba(13,59,120,.5)",zIndex:200,animation:"fadeIn .2s"}}/>
      )}

      {/* ══ SIDEBAR ══ */}
      <div style={{
        width:250,
        background:"linear-gradient(180deg,#0D3B78 0%,#1565C0 55%,#1E88E5 100%)",
        display:"flex",flexDirection:"column",flexShrink:0,
        boxShadow:"4px 0 24px rgba(13,59,120,.18)",
        ...(isMob?{position:"fixed",top:0,left:0,height:"100vh",zIndex:210,transition:"transform .28s cubic-bezier(.22,.9,.3,1)",transform:sideOpen?"translateX(0)":"translateX(-102%)"}:{})
      }}>

        {/* ໂລໂກ້ + ຊື່ທະນາຄານ */}
        <div style={{padding:"18px 16px 15px",borderBottom:"1px solid rgba(255,255,255,.12)"}}>
          <div style={{display:"flex",alignItems:"center",gap:11}}>
            <Logo size={42} ring/>
            <div style={{minWidth:0}}>
              <div style={{color:"#fff",fontSize:12.5,fontWeight:700,lineHeight:1.35}}>ທະນາຄານພັດທະນາລາວ</div>
              <div style={{color:"rgba(255,255,255,.6)",fontSize:9.5,marginTop:1}}>LDB · ສາຂາໂພນສະຫວັນ</div>
            </div>
          </div>
          <div style={{marginTop:13,background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.14)",
            borderRadius:10,padding:"9px 11px"}}>
            <div style={{color:"rgba(255,255,255,.6)",fontSize:9.5,marginBottom:3}}>ລວມຊົ່ວໂມງງວດນີ້</div>
            <div style={{color:"#fff",fontSize:21,fontWeight:700,lineHeight:1,fontVariantNumeric:"tabular-nums"}}>
              {toS(tmins)||"0:00"} <span style={{fontSize:11,fontWeight:400,opacity:.7}}>ຊົ່ວໂມງ</span>
            </div>
          </div>
        </div>

        <div style={{padding:"14px 16px 7px",fontSize:9.5,color:"rgba(255,255,255,.45)",letterSpacing:".12em",fontWeight:600}}>
          ພະນັກງານ ({emps.length})
        </div>

        {/* ລາຍຊື່ */}
        <div style={{flex:1,overflowY:"auto",padding:"2px 0 6px"}}>
          {emps.map(e=>{
            const s=e.id===sel, n=moCount(e.id), m=moMins(e.id);
            return(
              <div key={e.id} className="nav-i" onClick={()=>{setSel(e.id);if(isMob)setSideOpen(false);}} style={{
                padding:"10px 16px 10px 13px",cursor:"pointer",
                background:s?"rgba(255,255,255,.18)":"transparent",
                borderLeft:s?"3px solid #fff":"3px solid transparent"}}>
                <div style={{color:s?"#fff":"rgba(255,255,255,.85)",fontSize:12,fontWeight:s?700:400,
                  overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.name}</div>
                <div style={{color:s?"rgba(255,255,255,.75)":"rgba(255,255,255,.4)",fontSize:10,marginTop:3,
                  display:"flex",alignItems:"center",gap:6}}>
                  <span>{n} ລາຍການ</span>
                  {m>0&&<><span style={{opacity:.5}}>·</span><span style={{fontVariantNumeric:"tabular-nums"}}>{toS(m)} ຊມ</span></>}
                </div>
              </div>
            );
          })}
        </div>

        {/* ກົດໄລ່ OT */}
        <div style={{margin:"0 12px 12px",background:"rgba(255,255,255,.08)",borderRadius:10,padding:"10px 11px",border:"1px solid rgba(255,255,255,.12)"}}>
          <div style={{fontSize:9.5,color:"rgba(255,255,255,.5)",marginBottom:7,letterSpacing:".06em"}}>ກົດໄລ່ຊົ່ວໂມງ OT</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <span style={{width:8,height:8,borderRadius:2,background:"rgba(255,255,255,.8)",flexShrink:0}}/>
              <span style={{color:"rgba(255,255,255,.78)",fontSize:10}}><b style={{color:"#fff"}}>ຈັນ–ສຸກ</b> · 17:30–22:00, 22:00–06:00</span>
            </div>

            <button className="btn" onClick={()=>loadAll()} disabled={refreshing} title="ໂຫຼດຂໍ້ມູນຄືນ"

              {refreshing?<Spin sz={14} c={C.blue} w={2.6}/>:<Ic d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" sz={14}/>}
            </button>
            <button className="btn" onClick={doExport} disabled={exporting}

            <button className="btn" onClick={()=>setShowAdd(true)}
              style={{padding:"10px 16px",background:"linear-gradient(135deg,#0D3B78,#1E88E5)",borderRadius:9,fontSize:12.5,color:"#fff",display:"flex",alignItems:"center",gap:7,fontWeight:600,boxShadow:"0 4px 12px rgba(21,101,192,.32)"}}>

        </div>

        {/* ── ແຖບເລືອກງວດ (ກົດບ່ອນໃດກໍໄດ້ໃນຊ່ອງ) ── */}

            {icon:<IBar/>,   label:"22:00–06:00",   val:toS(btot[1])||"0:00", sub:"ທຸກວັນ",  color:"#00695C", bg:"#E0F2F1"},
            {icon:<IBar/>,   label:"ເສົາ–ອາທິດ",    val:toS(btot[2]+btot[3])||"0:00", sub:"08:00–16:00", color:"#2E7D32", bg:"#E8F5E9"},
          ].map((c,i)=>(

              <div style={{fontSize:10.5,color:C.muted,marginTop:5}}>{c.sub}</div>

        </div>

        <div style={{flex:1,overflowY:"auto",padding:isMob?"12px 12px 86px":"16px 22px 26px"}}>
          {loading?(
            <TableSkeleton rows={isMob?4:7}/>

            <div className="rise" style={{background:"#fff",border:`1px solid ${C.line}`,borderRadius:16,padding:"58px 22px",textAlign:"center",boxShadow:"var(--sh-1)"}}>

                display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",color:C.blue}}><IClock sz={26}/></div>
              <div style={{fontSize:16,fontWeight:700,color:C.ink,marginBottom:6}}>ຍັງບໍ່ມີລາຍການ OT ໃນງວດນີ້</div>

                  display:"inline-flex",alignItems:"center",gap:8,fontWeight:600,boxShadow:"0 6px 18px rgba(21,101,192,.3)"}}>

                display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>

                  <span className="hide-mob" style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:"rgba(255,255,255,.62)"}}>

                      <TH ch="22:00–06:00" center/>

                      <TH ch={<>12:00–16:00<br/><span style={{fontSize:9,opacity:.75}}>(ສ/ອ)</span></>} center green/>

                              <button className="icon-b" onClick={()=>setConfirmId(r.id)} title="ລົບ"
                                style={{padding:6,borderRadius:7,color:C.red,display:"flex"}}><IDel/></button>
                            </div>
                          </td>
                        </tr>
                      );

                    <tr>
                      <td colSpan={5} style={{padding:"11px 14px",background:"#FFF8DC",borderTop:`2px solid ${C.amber}`,

                      {[0,1,2,3].map(i=>(
                        <td key={i} style={{padding:"11px 8px",background:i>=2?"#F1FAF2":"#FFF8DC",borderTop:`2px solid ${C.amber}`,

                          color:btot[i]>0?(i>=2?"#155724":"#0D3B78"):"#B8C4D2",fontSize:12.5,borderRight:`1px solid #F0D48A`}}>{toS(btot[i])||"—"}</td>

                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

        {/* ── ແຖບລຸ່ມ (ມືຖື) ── */}

            padding:"9px 12px calc(9px + env(safe-area-inset-bottom))",display:"flex",gap:9,zIndex:100,boxShadow:"0 -4px 18px rgba(13,59,120,.1)"}}>
            <button className="btn" onClick={doExport} disabled={exporting}
              style={{flex:1,padding:"12px",background:C.sky50,border:`1px solid ${C.sky100}`,borderRadius:11,fontSize:13,color:C.blue,

              {exporting?<Spin sz={15} c={C.blue} w={2.6}/>:<IDl/>}{exporting?"ກຳລັງສ້າງ...":"Export"}

            <button className="btn" onClick={()=>setShowAdd(true)}
              style={{flex:1.4,padding:"12px",background:"linear-gradient(135deg,#0D3B78,#1E88E5)",borderRadius:11,fontSize:13,color:"#fff",

              <IPlus/> ເພີ່ມ OT
            </button>
          </div>
        )}
      </div>

      {/* ══ ຢືນຢັນການລົບ ══ */}
      {confirmId&&(()=>{
        const r=list.find(x=>x.id===confirmId);
        return(
          <div style={{position:"fixed",inset:0,background:"rgba(13,59,120,.5)",backdropFilter:"blur(3px)",
            display:"flex",alignItems:"center",justifyContent:"center",zIndex:400,padding:16,animation:"fadeIn .18s"}}>
            <div className="pop" style={{background:"#fff",borderRadius:16,width:340,maxWidth:"100%",overflow:"hidden",boxShadow:"var(--sh-3)"}}>
              <div style={{background:"#C62828",padding:"14px 18px",display:"flex",alignItems:"center",gap:9}}>
                <IWarn sz={18} c="#fff"/><span style={{color:"#fff",fontSize:14,fontWeight:700}}>ຢືນຢັນການລົບ</span>
              </div>
              <div style={{padding:"18px 18px 14px"}}>
                <p style={{fontSize:13,color:C.body,marginBottom:12,lineHeight:1.6}}>ຕ້ອງການລົບ OT ລາຍການນີ້ອອກແທ້ບໍ?</p>
                {r&&<div style={{background:"#FFF5F5",border:"1px solid #FFD5D5",borderRadius:10,padding:"11px 13px",fontSize:12,color:"#B23131",lineHeight:1.9}}>

                  <div>ລວມ: <b>{toS(calcBands(r.startTime,r.endTime,r.date).reduce((a,b)=>a+b,0))||"0:00"} ຊົ່ວໂມງ</b></div>

              </div>
              <div style={{display:"flex",gap:9,padding:"0 18px 18px"}}>
                <button className="btn" onClick={()=>setConfirmId(null)} disabled={deleting}
                  style={{flex:1,padding:"11px",background:"#F3F6FA",border:`1px solid ${C.line}`,borderRadius:10,fontSize:13,color:C.body,fontWeight:600}}>ຍົກເລີກ</button>
                <button className="btn" onClick={()=>del(confirmId)} disabled={deleting}
                  style={{flex:1,padding:"11px",background:"#C62828",borderRadius:10,fontSize:13,color:"#fff",fontWeight:700,
                    display:"flex",alignItems:"center",justifyContent:"center",gap:7,boxShadow:"0 4px 12px rgba(198,40,40,.3)",opacity:deleting?.8:1}}>
                  {deleting?<><Spin sz={14}/>ກຳລັງລົບ...</>:<><IDel/>ລົບອອກ</>}
                </button>
              </div>
            </div>
          </div>

      })()}

      {/* ══ ຟອມ ເພີ່ມ / ແກ້ໄຂ ══ */}
      {(showAdd||editId)&&(()=>{
        const isEdit=!!editId;
        const f=isEdit?editForm:form;
        const setF=isEdit?setEditForm:setForm;
        const bandsP=calcBands(f.startTime,f.endTime,f.date);
        const totP=bandsP.reduce((a,b)=>a+b,0);
        const we=f.date?isWE(f.date):false;
        const close=()=>{ if(saving)return; isEdit?setEditId(null):setShowAdd(false); };
        return(
          <div onClick={close} style={{position:"fixed",inset:0,background:"rgba(13,59,120,.5)",backdropFilter:"blur(3px)",
            display:"flex",alignItems:isMob?"flex-end":"center",justifyContent:"center",zIndex:300,animation:"fadeIn .18s"}}>
            <div onClick={e=>e.stopPropagation()} style={{background:"#fff",
              borderRadius:isMob?"20px 20px 0 0":16,width:isMob?"100%":460,maxWidth:"96vw",maxHeight:isMob?"93vh":"92vh",
              overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"var(--sh-3)",
              animation:isMob?"sheetUp .3s cubic-bezier(.22,.9,.3,1) both":"pop .26s cubic-bezier(.22,.9,.3,1) both"}}>

              {isMob&&<div style={{display:"flex",justifyContent:"center",padding:"9px 0 2px"}}>
                <div style={{width:38,height:4,borderRadius:2,background:"#D3DEEB"}}/></div>}

              <div style={{background:isMob?"#fff":"linear-gradient(135deg,#0D3B78,#1E88E5)",padding:isMob?"10px 18px 12px":"15px 18px",
                display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:isMob?`1px solid ${C.line}`:"none"}}>
                <div style={{display:"flex",alignItems:"center",gap:9}}>
                  <div style={{width:3,height:16,background:isMob?C.blue:"rgba(255,255,255,.85)",borderRadius:2}}/>
                  <span style={{color:isMob?C.ink:"#fff",fontSize:14.5,fontWeight:700}}>{isEdit?"ແກ້ໄຂລາຍການ OT":"ເພີ່ມ OT ໃໝ່"}</span>
                </div>
                <button className="btn" onClick={close} style={{color:isMob?C.muted:"rgba(255,255,255,.8)",padding:5,borderRadius:8}}><IX sz={16}/></button>
              </div>

              <div style={{padding:18,overflowY:"auto"}}>
                {/* ພະນັກງານ + ວັນທີ */}
                <div style={{background:C.sky50,borderRadius:12,padding:"12px 14px",marginBottom:14,border:`1px solid ${C.sky100}`}}>
                  <div style={{fontSize:11,color:C.muted,marginBottom:9,display:"flex",alignItems:"center",gap:6}}>
                    <Ic d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 3a4 4 0 100 8 4 4 0 000-8z" sz={13}/>{emp?emp.name:""}
                  </div>
                  <PickField type="date" label="ວັນທີ" value={f.date} accent
                    onChange={e=>{
                      const v=e.target.value;
                      const wknd=v?[0,6].includes(new Date(v).getDay()):false;
                      setF(x=>({...x,date:v,startTime:wknd?"08:00":"17:30"}));
                    }}/>
                  {f.date&&<div style={{marginTop:9}}>
                    <span style={{fontSize:11,fontWeight:600,color:we?"#155724":"#0D3B78",
                      background:we?C.greenL:"#E1F1FE",border:`1px solid ${we?C.greenB:C.sky200}`,
                      padding:"3px 11px",borderRadius:99,display:"inline-flex",alignItems:"center",gap:6}}>
                      <span style={{width:6,height:6,borderRadius:"50%",background:we?"#43A047":C.blue}}/>
                      ວັນ{dayL(f.date)} — {we?"ເສົາ/ອາທິດ · ນັບ 4 ຊ່ວງ":"ວັນທຳມະດາ · ນັບ 2 ຊ່ວງ"}
                    </span>
                  </div>}
                </div>

                {/* ເວລາ */}
                <div style={{display:"flex",gap:10,marginBottom:11}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10.5,color:C.muted,fontWeight:600,marginBottom:5,paddingLeft:2}}>ເລີ່ມ OT (ຄົງທີ່)</div>
                    <div style={{padding:"11px 12px",border:`1.5px solid ${C.line}`,borderRadius:10,fontSize:13.5,color:C.muted,
                      background:"#F2F5F9",fontWeight:700,display:"flex",alignItems:"center",gap:8}}>
                      <IClock sz={14}/>{f.startTime||"17:30"}
                    </div>
                  </div>
                  <PickField type="time" label="ກົດເຂົ້າ (ເຊົ້າ)" icon={<IIn sz={14}/>} value={f.clockIn}
                    onChange={e=>setF(x=>({...x,clockIn:e.target.value}))}/>
                </div>

                <div style={{marginBottom:14}}>
                  <PickField type="time" label="ກົດອອກ (ຈຳເປັນ)" icon={<IOut sz={14}/>} accent value={f.endTime}
                    onChange={e=>setF(x=>({...x,endTime:e.target.value,clockOut:e.target.value}))}/>
                </div>

                {/* ສະຫຼຸບ */}
                {totP>0&&(
                  <div className="rise" style={{background:"linear-gradient(135deg,#F4F9FF,#EAF3FE)",border:`1px solid ${C.sky100}`,
                    borderLeft:`3px solid ${C.blue500}`,borderRadius:"0 12px 12px 0",padding:"12px 14px",marginBottom:14}}>
                    <div style={{fontSize:11,color:C.muted,marginBottom:4}}>ສະຫຼຸບຊົ່ວໂມງທີ່ຈະບັນທຶກ</div>
                    <div style={{fontSize:22,fontWeight:700,color:C.blue,marginBottom:9,fontVariantNumeric:"tabular-nums"}}>{toS(totP)} <span style={{fontSize:12,fontWeight:400,color:C.muted}}>ຊົ່ວໂມງ</span></div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {BANDS.map((b,i)=>bandsP[i]>0&&(
                        <span key={i} style={{background:i>=2?C.greenL:"#E1F1FE",border:`1px solid ${i>=2?C.greenB:C.sky200}`,
                          color:i>=2?"#155724":"#0D3B78",fontSize:10.5,padding:"3px 10px",borderRadius:99,fontWeight:600}}>
                          {b.l} · {toS(bandsP[i])}
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                {/* ໝາຍເຫດ */}
                <div style={{marginBottom:18}}>
                  <div style={{fontSize:10.5,color:C.muted,fontWeight:600,marginBottom:5,paddingLeft:2}}>ໝາຍເຫດ</div>
                  <div style={{display:"flex",alignItems:"center",gap:8,border:`1.5px solid ${C.line}`,borderRadius:10,padding:"10px 12px",background:"#F7FAFE"}}>
                    <span style={{color:C.muted,display:"flex"}}><INote sz={14}/></span>
                    <input type="text" placeholder="ເຊັ່ນ: ປິດບັນຊີສິ້ນເດືອນ" value={f.remarks}
                      onChange={e=>setF(x=>({...x,remarks:e.target.value}))}
                      style={{flex:1,border:"none",background:"transparent",fontSize:13.5,color:C.ink}}/>
                  </div>
                </div>

                <div style={{display:"flex",gap:9}}>
                  <button className="btn" onClick={close} disabled={saving}
                    style={{flex:1,padding:"12px",background:"#F3F6FA",border:`1px solid ${C.line}`,borderRadius:11,fontSize:13,color:C.body,fontWeight:600}}>ຍົກເລີກ</button>
                  <button className="btn" onClick={isEdit?saveEdit:saveEntry} disabled={saving}
                    style={{flex:2,padding:"12px",background:"linear-gradient(135deg,#0D3B78,#1E88E5)",borderRadius:11,fontSize:13,color:"#fff",fontWeight:700,
                      display:"flex",alignItems:"center",justifyContent:"center",gap:8,boxShadow:"0 5px 16px rgba(21,101,192,.32)",opacity:saving?.85:1}}>
                    {saving?<><Spin sz={15}/>ກຳລັງບັນທຶກ...</>:<><IOk sz={15}/>{isEdit?"ບັນທຶກການແກ້ໄຂ":"ບັນທຶກ OT"}</>}
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}

    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
