<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>ລະບົບ OT — ທະນາຄານພັດທະນາລາວ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --brand:#1565C0; --brand-d:#0D3C74; --brand-l:#42A5F5;
  --eve:#1565C0; --night:#5E35B1; --wam:#2E7D32; --wpm:#00897B;
  --ink:#0E2A47; --ink-2:#3A5A7A; --muted:#7C93AA;
  --line:#E4EBF4; --line-2:#EFF4F9;
  --bg:#F3F7FC; --surf:#FFFFFF; --tint:#F2F7FE;
  --danger:#D32F2F;
  --r:14px; --r-s:10px;
  --sh-1:0 1px 2px rgba(14,42,71,.05);
  --sh-2:0 2px 4px rgba(14,42,71,.04),0 12px 28px rgba(14,42,71,.07);
  --sh-3:0 24px 60px rgba(14,42,71,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{
  font-family:'Noto Sans Lao','Phetsarath OT',sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
.num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1;letter-spacing:0}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD9E8;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#A9C0D8}

/* ── ໂມງລາຍເສັ້ນ (signature loader) ── */
@keyframes clk-spin{to{transform:rotate(360deg)}}
@keyframes clk-sweep{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-126}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes pop-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes toast-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(240%)}}
.clk-m{transform-origin:24px 24px;animation:clk-spin 1.15s linear infinite}
.clk-h{transform-origin:24px 24px;animation:clk-spin 8s linear infinite}
.clk-arc{transform-origin:24px 24px;animation:clk-spin 2.4s cubic-bezier(.6,.15,.35,.9) infinite}
@media(prefers-reduced-motion:reduce){.clk-m,.clk-h,.clk-arc{animation-duration:4s}}

/* ── boot splash ── */
#boot{position:fixed;inset:0;z-index:9000;background:linear-gradient(170deg,#0D3C74,#1565C0 55%,#1E88E5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .logo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.25);padding:2px}
#boot .name{color:#fff;font-size:16px;font-weight:700;letter-spacing:.01em}
#boot .sub{color:rgba(255,255,255,.6);font-size:11px;margin-top:3px;letter-spacing:.14em;text-transform:uppercase}
#boot .msg{color:rgba(255,255,255,.72);font-size:12.5px}
#boot .track{width:170px;height:2px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
#boot .track i{display:block;width:40%;height:100%;background:#fff;border-radius:2px;animation:bar 1.1s ease-in-out infinite}

/* ── layout ── */
.app{display:flex;height:100%;overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(9,29,50,.5);z-index:200;backdrop-filter:blur(2px)}
.side{width:264px;flex-shrink:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0D3C74,#1565C0 62%,#1976D2);color:#fff}
.side-head{padding:18px 18px 16px}
.brandbox{display:flex;align-items:center;gap:11px}
.brandbox img,.brandbox .mono{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.brandbox .mono{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.04em}
.brandbox b{display:block;font-size:13px;font-weight:700;line-height:1.35}
.brandbox span{display:block;font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.08em;margin-top:2px}
.side-title{padding:0 18px 8px;font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.42);font-weight:600}
.legend{margin:0 14px 12px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12)}
.legend p{font-size:10px;color:rgba(255,255,255,.5);margin-bottom:8px;letter-spacing:.06em}
.legend div{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.85);margin-top:6px}
.legend i{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.emps{flex:1;overflow-y:auto;padding:2px 10px 10px}
.emps::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border:2px solid transparent}
.emp{width:100%;text-align:left;padding:10px 12px;border-radius:11px;display:block;transition:background .15s;margin-bottom:2px}
.emp:hover{background:rgba(255,255,255,.08)}
.emp.on{background:rgba(255,255,255,.17);box-shadow:inset 3px 0 0 #fff}
.emp b{display:block;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.86);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emp.on b{color:#fff;font-weight:600}
.emp span{font-size:10.5px;color:rgba(255,255,255,.42)}
.emp.on span{color:rgba(255,255,255,.72)}
.side-foot{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:rgba(255,255,255,.42);display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 0 3px rgba(124,255,178,.2)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{position:relative;z-index:30;height:62px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 20px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:15.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.top p{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.burger{width:38px;height:38px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0}
.burger i{width:17px;height:1.8px;background:var(--ink-2);border-radius:2px;display:block}
.range{display:flex;align-items:center;gap:2px;height:40px;padding:0 6px;border:1px solid var(--line);
  background:var(--surf);border-radius:12px;flex-shrink:0;box-shadow:var(--sh-1)}
.range input{border:none;background:transparent;font-size:12.5px;font-weight:600;color:var(--brand);
  padding:6px 4px;width:118px;cursor:pointer;}
.range input:focus{outline:none}
.range em{color:#B9C9D9;font-style:normal;font-size:12px}

.btn{height:40px;padding:0 16px;border-radius:12px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;flex-shrink:0;transition:.15s;border:1px solid transparent}
.btn:active{transform:translateY(1px)}
.btn-p{background:linear-gradient(135deg,#1565C0,#1E88E5);color:#fff;box-shadow:0 4px 14px rgba(21,101,192,.3)}
.btn-p:hover{box-shadow:0 6px 18px rgba(21,101,192,.38)}
.btn-g{background:var(--surf);border-color:var(--line);color:var(--brand);box-shadow:var(--sh-1)}
.btn-g:hover{border-color:#BBD5F0;background:var(--tint)}
.btn-q{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn-d{background:var(--danger);color:#fff;box-shadow:0 4px 14px rgba(211,47,47,.28)}

.scroll{flex:1;overflow-y:auto;padding:18px 20px 28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh-1);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.stat .lb{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:9px;font-weight:500}
.stat .lb i{width:7px;height:7px;border-radius:50%;background:var(--c);flex-shrink:0}
.stat .v{font-size:25px;font-weight:600;color:var(--c);line-height:1}
.stat .s{font-size:11px;color:var(--muted);margin-top:5px}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);overflow:hidden}
.card-h{padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,#FBFDFF,#F6FAFE)}
.card-h b{font-size:13px;font-weight:600;color:var(--ink)}
.card-h .cnt{font-size:11px;font-weight:600;color:var(--brand);background:var(--tint);border:1px solid #DCEAFB;padding:3px 10px;border-radius:20px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;z-index:2;background:#F7FAFE;color:var(--ink-2);font-weight:600;font-size:11px;
  text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line);letter-spacing:.02em}
thead th.c{text-align:center}
thead th .sm{display:block;font-size:9px;color:var(--muted);font-weight:500;margin-top:1px}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
tbody tr:hover td{background:#F9FCFF}
tbody tr.we td{background:#F4FBF5}
tbody tr.we:hover td{background:#EDF8EF}
td.c{text-align:center}
.chip{display:inline-block;min-width:52px;padding:3px 9px;border-radius:8px;font-weight:600;font-size:12px;color:#fff}
.off{color:#C6D3DF}
.daytag{display:inline-flex;align-items:center;gap:6px}
.daytag i{width:6px;height:6px;border-radius:50%;background:var(--wam)}
tfoot td{padding:12px;background:#F7FAFE;border-top:2px solid var(--line);font-weight:700;color:var(--ink);font-size:12.5px}
.ico{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.ico:hover{background:var(--tint)}
.ico.del:hover{background:#FEECEC}

/* mobile rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 15px}
.row.we{border-left:3px solid var(--wam)}
.row-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:11px}
.row-h .d{font-size:15px;font-weight:600;color:var(--ink)}
.row-h .w{font-size:11px;color:var(--muted);margin-top:2px}
.row-h .t{font-size:17px;font-weight:600;color:var(--brand)}
.times{display:flex;gap:8px;margin-bottom:10px}
.tbox{flex:1;background:#F7FAFD;border:1px solid var(--line-2);border-radius:var(--r-s);padding:7px 10px}
.tbox span{display:block;font-size:9.5px;color:var(--muted);margin-bottom:2px;letter-spacing:.04em}
.tbox b{font-size:13.5px;font-weight:600;color:var(--ink)}
.bands{display:flex;flex-wrap:wrap;gap:6px}
.band{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;color:#fff}
.row-a{display:flex;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2)}
.row-a button{flex:1;height:36px;border-radius:10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line)}
.row-a .e{color:var(--brand)}
.row-a .r{color:var(--danger);border-color:#F6DADA}

.empty{background:var(--surf);border:1px dashed #CFDEEE;border-radius:var(--r);padding:56px 24px;text-align:center}
.empty b{display:block;font-size:16px;font-weight:600;color:var(--ink);margin:16px 0 6px}
.empty p{font-size:12.5px;color:var(--muted);margin-bottom:20px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(9,29,50,.44);backdrop-filter:blur(3px);z-index:400;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade-in .18s ease}
.modal{background:var(--surf);border-radius:18px;width:440px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;
  box-shadow:var(--sh-3);overflow:hidden;animation:pop-in .22s cubic-bezier(.2,.8,.3,1)}
.modal-h{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-2)}
.modal-h b{font-size:15px;font-weight:600;color:var(--ink)}
.modal-h span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:14px 20px 18px;display:flex;gap:10px;border-top:1px solid var(--line-2)}
.modal-f .btn{flex:1;height:46px}
.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.03em}
.fld{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surf);
  font-size:15px;font-weight:500;color:var(--ink);transition:.15s}
.fld:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(21,101,192,.13)}
.fld[readonly]{background:#F5F8FB;color:var(--muted);border-style:dashed}
.fld.key{border-color:#BBD5F0;background:var(--tint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fset{margin-bottom:14px}
.preview{border-radius:12px;background:linear-gradient(135deg,#F2F7FE,#EAF3FD);border:1px solid #DCEAFB;padding:13px 15px;margin-bottom:14px}
.preview .k{font-size:11px;color:var(--muted)}
.preview .v{font-size:24px;font-weight:600;color:var(--brand);margin:2px 0 9px}
.warn{background:#FEF6F6;border:1px solid #F6DADA;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#8C2A2A;line-height:1.9}
.warn b{color:var(--danger)}
.hintbox{background:#F1F8F2;border:1px solid #CFE7D3;border-radius:10px;padding:9px 12px;
  font-size:11.5px;color:#2E5B33;line-height:1.75;margin-top:8px}

/* busy + toast */
.busy{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:800;display:flex;align-items:center;gap:10px;
  background:rgba(14,42,71,.94);color:#fff;padding:10px 18px 10px 12px;border-radius:99px;font-size:12.5px;font-weight:500;
  box-shadow:0 12px 32px rgba(14,42,71,.3);animation:toast-in .2s ease}
.toasts{position:fixed;right:18px;bottom:18px;z-index:850;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--brand);
  padding:11px 16px;border-radius:12px;font-size:12.5px;font-weight:500;color:var(--ink);box-shadow:var(--sh-2);animation:toast-in .2s ease;max-width:320px}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:#2E7D32}

.mbar{display:none}
@media(max-width:820px){
  .side{position:fixed;top:0;left:0;bottom:0;z-index:210;transform:translateX(-100%);transition:transform .26s cubic-bezier(.3,.8,.3,1)}
  .side.open{transform:none}
  .top{height:58px;padding:0 12px;gap:8px}
  .range input{width:96px;font-size:11.5px}
  .scroll{padding:14px 14px 96px}
  .stats{grid-template-columns:1fr 1fr;gap:9px}
  .stat .v{font-size:21px}
  .mbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:150;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .mbar .btn{flex:1;height:46px}
  .mask{padding:0;align-items:flex-end}
  .modal{width:100%;max-width:100%;border-radius:20px 20px 0 0;max-height:94vh;animation:sheet-in .26s cubic-bezier(.3,.8,.3,1)}
  .grab{width:38px;height:4px;border-radius:4px;background:#D6E0EB;margin:9px auto 0}
}

/* ── ຊ່ອງເລືອກວັນທີ / ເວລາ ── */
.fldbtn{width:100%;height:48px;padding:0 12px 0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surf);
  display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--ink);transition:.15s;text-align:left}
.fldbtn:hover{border-color:#BBD5F0;background:var(--tint)}
.fldbtn.on{border-color:var(--brand);background:var(--surf);box-shadow:0 0 0 4px rgba(21,101,192,.13)}
.fldbtn.key{border-color:#BBD5F0;background:var(--tint)}
.fldbtn .ph{color:#A9BCCD;font-weight:400;font-size:14px}
.fldbtn .ic2{color:var(--brand);display:flex;flex-shrink:0}
.fldbtn .ic{margin-left:auto;color:#B4C6D6;display:flex;flex-shrink:0}
.fldbtn .sub{font-size:12px;color:var(--muted);font-weight:500}
.fldbtn.mini{height:34px;width:auto;border:none;background:transparent;padding:0 10px;border-radius:10px;
  font-size:12.5px;font-weight:600;color:var(--brand);gap:6px}
.fldbtn.mini:hover{background:var(--tint)}
.fldbtn.mini.on{box-shadow:none;background:var(--tint)}

.popmask{position:fixed;inset:0;z-index:9500}
.pop{position:fixed;z-index:9501;background:var(--surf);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--sh-3);overflow:hidden;animation:pop-in .16s ease}
.pop-sheet{position:fixed;left:0;right:0;bottom:0;z-index:9501;background:var(--surf);border-radius:20px 20px 0 0;
  box-shadow:var(--sh-3);animation:sheet-in .24s cubic-bezier(.3,.8,.3,1);padding-bottom:env(safe-area-inset-bottom)}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--line-2)}
.pop-h b{font-size:13.5px;font-weight:600;color:var(--ink)}
.nav{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--brand)}
.nav:hover{background:var(--tint)}
.pop-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line-2)}
.pop-f button{flex:1;height:38px;border-radius:10px;font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--ink-2)}
.pop-f button:hover{background:var(--tint)}
.pop-f button.p{background:var(--brand);color:#fff;border-color:transparent}

.cal{padding:10px 12px 12px}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.cal .dow span{text-align:center;font-size:10px;color:var(--muted);font-weight:600;padding:5px 0}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .d{height:38px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;transition:.12s}
.cal .d:hover{background:var(--tint)}
.cal .d.we{color:var(--wam)}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--brand-l)}
.cal .d.on{background:var(--brand);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(21,101,192,.35)}
.cal .d.on.we{background:var(--wam);box-shadow:0 3px 10px rgba(46,125,50,.35)}

.tbig{width:100%;display:block;text-align:center;font-size:30px;font-weight:600;color:var(--brand);

<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;

/* ໂລໂກ້ — ຕັ້ງຄ່າຢູ່ window.LDB_LOGO ດ້ານເທິງຂອງ body */
const LOGO=window.LDB_LOGO||"";

/* ── ສີປະຈຳແຕ່ລະຊ່ວງເວລາ ── */
const C={eve:"#1565C0",night:"#5E35B1",wam:"#2E7D32",wpm:"#00897B"};

const toM=t=>{if(!t)return 0;const[h,m]=t.split(":").map(Number);return h*60+(m||0)};
const toS=m=>{if(!m||m<=0)return"";const h=Math.floor(m/60),n=Math.round(m%60);return`${h}:${n.toString().padStart(2,"0")}`};

const BANDS=[
  {l:"17:30–22:00", s:17*60+30, e:22*60,      wk:true,  we:true,  c:C.eve,   n:"ແລງ"},
  {l:"22:00–06:00", s:22*60,    e:24*60+6*60, wk:true,  we:true,  c:C.night, n:"ກາງຄືນ"},
  {l:"08:00–12:00", s:8*60,     e:12*60,      wk:false, we:true,  c:C.wam,   n:"ເສົາ-ອາທິດ ເຊົ້າ"},
  {l:"12:00–16:00", s:12*60,    e:16*60,      wk:false, we:true,  c:C.wpm,   n:"ເສົາ-ອາທິດ ສວາຍ"},
];

const isWE=d=>[0,6].includes(new Date(d).getDay());

/* ══════════════════════════════════════════════════════════════
   ເວລາເລີ່ມ OT ຕົວຈິງ
   - ວັນຈັນ-ສຸກ : ຄົງທີ່ 17:30
   - ວັນເສົາ-ອາທິດ : ຖ້າມີເວລາ "ກົດເຂົ້າ" ຫຼັງ 08:00 ໃຫ້ນັບຈາກເວລາກົດເຂົ້ານັ້ນ
                     (ຕົວຢ່າງ ມາເຮັດວຽກ 15:30 ອອກ 17:30 = 0:30 ບໍ່ແມ່ນ 8:00)
                     ຖ້າບໍ່ມີ ຫຼື ກົດເຂົ້າກ່ອນ 08:00 ຈຶ່ງໃຊ້ 08:00
   ══════════════════════════════════════════════════════════════ */
const WE_START="08:00";
function otStart(r){
  if(!r) return "17:30";
  if(!r.date||!isWE(r.date)) return r.startTime||"17:30";
  const ci=r.clockIn?toM(r.clockIn):0;
  return ci>toM(WE_START)?r.clockIn:WE_START;
}

function calcBands(s0,e0,dateStr,clockIn){
  if(!s0||!e0)return[0,0,0,0];
  const we=dateStr?isWE(dateStr):false;
  const es=we?otStart({date:dateStr,startTime:s0,clockIn}):s0;
  const s=toM(es);let e=toM(e0);
  if(e<=s && e<12*60 && (s>=12*60 || we)) e+=1440;
  if(e<=s) return[0,0,0,0];
  return BANDS.map(b=>{
    if(we?!b.we:!b.wk)return 0;
    const o1=Math.max(0,Math.min(e,b.e)-Math.max(s,b.s));
    const o2=Math.max(0,Math.min(e,b.e+1440)-Math.max(s,b.s+1440));
    return o1+o2;
  });
}
/* ຄິດໄລ່ຈາກລາຍການໂດຍກົງ */
const bandsOf=r=>calcBands(r.startTime||"17:30",r.endTime,r.date,r.clockIn);

const DAYS=["ອາທິດ","ຈັນ","ອັງຄານ","ພຸດ","ພະຫັດ","ສຸກ","ເສົາ"];
const dayL=d=>DAYS[new Date(d).getDay()];
const fmtD=d=>{const t=new Date(d);return`${t.getDate()}/${t.getMonth()+1}/${t.getFullYear()}`};
const pad=n=>String(n).padStart(2,"0");

/* ຮອບບັນຊີ: 21 ເດືອນກ່ອນ → 20 ເດືອນນີ້ */
function defRange(){
  const d=new Date();
  let ey=d.getFullYear(),em=d.getMonth();
  if(d.getDate()>20){em+=1;if(em>11){em=0;ey+=1}}
  let sy=ey,sm=em-1;if(sm<0){sm=11;sy-=1}
  return[`${sy}-${pad(sm+1)}-21`,`${ey}-${pad(em+1)}-20`];
}

/* ══════════ Excel export ══════════ */
async function exportXL(emp,all,startDate,endDate){
  const rows=(all[emp.id]||[])
    .filter(e=>e.date>=startDate&&e.date<=endDate)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("OT");
  ws.columns=[{width:13},{width:9},{width:10},{width:10},{width:10},{width:13},{width:13},{width:13},{width:13},{width:18}];
  const thin={style:"thin",color:{argb:"FF000000"}};
  const bd={top:thin,bottom:thin,left:thin,right:thin};

  const hr=ws.addRow([]);hr.height=32;
  ["ວັນທີ","ວັນ","ເລີ່ມ OT","ກົດເຂົ້າ","ອອກ","17:30-22:00","22:00-06:00","08:00-12:00 (ສ/ອ)","12:00-16:00 (ສ/ອ)","ໝາຍເຫດ"]
  .forEach((h,i)=>{
    const c=hr.getCell(i+1);
    c.value=h;
    c.font={name:"Phetsarath OT",bold:true,size:10};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
    c.alignment={horizontal:"center",vertical:"middle",wrapText:true};
    c.border=bd;
  });

  const tb=[0,0,0,0];
  rows.forEach(r=>{
    const we=isWE(r.date);
    const b=bandsOf(r);
    b.forEach((x,i)=>tb[i]+=x);
    const dr=ws.addRow([]);dr.height=18;
    [
      [fmtD(r.date),"left"],
      [dayL(r.date),"center"],
      [otStart(r),"center"],
      [r.clockIn||"—","center"],
      [r.endTime||"—","center"],
      [b[0]>0?toS(b[0]):"—","center",true],
      [b[1]>0?toS(b[1]):"—","center",true],
      [we?(b[2]>0?toS(b[2]):"—"):"—","center"],
      [we?(b[3]>0?toS(b[3]):"—"):"—","center"],
      [r.remarks||"","left"]
    ].forEach(([v,al,bold],i)=>{
      const c=dr.getCell(i+1);
      c.value=v;
      c.font={name:"Phetsarath OT",bold:!!bold,size:10};
      c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
      c.alignment={horizontal:al,vertical:"middle"};
      c.border=bd;
    });
  });

  const tr=ws.addRow([]);tr.height=20;
  ws.mergeCells(tr.number,1,tr.number,5);
  [tb[0]>0?toS(tb[0]):"—",tb[1]>0?toS(tb[1]):"—",tb[2]>0?toS(tb[2]):"—",tb[3]>0?toS(tb[3]):"—",""]
  .forEach((v,i)=>{
    const c=tr.getCell(i+6);
    c.value=v;
    c.font={name:"Phetsarath OT",bold:true,size:10};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
    c.alignment={horizontal:"center",vertical:"middle"};
    c.border=bd;
  });
  const lbl=tr.getCell(1);
  lbl.value="ລວມທັງໝົດ";
  lbl.font={name:"Phetsarath OT",bold:true,size:10};
  lbl.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
  lbl.alignment={horizontal:"center",vertical:"middle"};
  lbl.border=bd;

  const buf=await wb.xlsx.writeBuffer();
  const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  const a=document.createElement("a");a.href=url;
  a.download=`OT_${emp.name}_${startDate}_${endDate}.xlsx`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

const Clock=({size=44,color="var(--brand)",track="rgba(21,101,192,.18)",w=2.2,ticks=true})=>(

function Pop({anchor,onClose,width=308,isMob,children}){
  const[pos,setPos]=useState(null);
  const box=useRef(null);
  useEffect(()=>{
    if(isMob)return;
    const calc=()=>{
      if(!anchor)return;
      const r=anchor.getBoundingClientRect();
      const w=Math.min(width,window.innerWidth-24);
      const h=Math.min((box.current&&box.current.scrollHeight)||360,window.innerHeight-24);
      /* ຖ້າຊ່ອງຢູ່ເຄິ່ງຂວາຂອງຈໍ ໃຫ້ຈັດຂອບຂວາໃຫ້ຊ້ອນກັນ */
      let left=(r.left+r.width/2>window.innerWidth/2)?r.right-w:r.left;
      left=Math.min(Math.max(12,left),window.innerWidth-w-12);
      let top=r.bottom+8;
      if(top+h>window.innerHeight-12) top=r.top-h-8;
      if(top<12) top=Math.max(12,(window.innerHeight-h)/2);
      setPos({left,top,width:w,maxHeight:window.innerHeight-24});
    };
    calc();
    const t=setTimeout(calc,0);
    window.addEventListener("resize",calc);
    window.addEventListener("scroll",calc,true);
    return()=>{clearTimeout(t);window.removeEventListener("resize",calc);window.removeEventListener("scroll",calc,true)};
  },[anchor,isMob,width]);
  useEffect(()=>{
    const esc=e=>{if(e.key==="Escape")onClose()};
    window.addEventListener("keydown",esc);
    return()=>window.removeEventListener("keydown",esc);
  },[onClose]);
  const body=(<>
    <div className="popmask" onClick={onClose}
      style={isMob?{background:"rgba(9,29,50,.42)",backdropFilter:"blur(2px)"}:undefined}/>
    {isMob
      ? <div className="pop-sheet">{children}</div>
      : <div className="pop" ref={box}
          style={pos?{...pos,overflowY:"auto"}:{left:-9999,top:0,width,visibility:"hidden"}}>{children}</div>}
  </>);
  /* render ຢູ່ body ໂດຍກົງ — ກັນບໍ່ໃຫ້ backdrop-filter ຂອງ header ກົດ popover ໄປທາງຫຼັງ */
  return ReactDOM.createPortal(body,document.body);
}

/* ── ຊ່ອງເວລາ: ພິມເອົາ + ປຸ່ມ AM/PM ໃນຊ່ອງ ── */
function TimeField({value,onChange,keyStyle}){
  const[txt,setTxt]=useState(value||"");
  const[pm,setPm]=useState(false);
  useEffect(()=>{
    setTxt(value||"");
    if(value)setPm(Number(value.split(":")[0])>=12);
  },[value]);

  /* ປ່ຽນເລກທີ່ພິມເປັນເວລາ 24 ຊົ່ວໂມງ ໂດຍອີງໃສ່ AM/PM ທີ່ເລືອກ */
  const build=(d,isPM)=>{
    if(!d)return"";
    let hh,mm;
    if(d.length<=2){hh=Number(d);mm=0}
    else{hh=Number(d.slice(0,d.length-2));mm=Math.min(59,Number(d.slice(-2)))}
    if(hh<=12) hh=(hh%12)+(isPM?12:0);
    hh=Math.min(23,hh);
    return `${pad(hh)}:${pad(mm)}`;
  };

  const onTxt=e=>{
    const d=e.target.value.replace(/[^0-9]/g,"").slice(0,4);
    setTxt(d.length<=2?d:d.slice(0,2)+":"+d.slice(2));
    if(d.length===0){onChange("");return}
    if(d.length===4) onChange(build(d,pm));
  };
  const commit=()=>{
    const d=txt.replace(/[^0-9]/g,"");
    if(!d){setTxt("");onChange("");return}
    const v=build(d,pm);setTxt(v);onChange(v);
  };
  const setMer=isPM=>{
    setPm(isPM);
    const d=txt.replace(/[^0-9]/g,"");
    if(d){const v=build(d,isPM);setTxt(v);onChange(v)}
  };

  return(
    <div className="tfield">
      <span className="ic2"><IClk s={17}/></span>
      <input className={"fld tin num"+(keyStyle?" key":"")} value={txt} onChange={onTxt} onBlur={commit}
        onKeyDown={e=>{if(e.key==="Enter"){commit();e.currentTarget.blur()}}}
        inputMode="numeric" placeholder="--:--" maxLength={5} aria-label="ເວລາ"/>
      <div className="mer">
        <button className={pm?"":"on"} onClick={()=>setMer(false)} tabIndex={-1}>AM</button>
        <button className={pm?"on":""} onClick={()=>setMer(true)} tabIndex={-1}>PM</button>
      </div>
    </div>
  );
}

const resizePhoto=file=>new Promise((res,rej)=>{
  const rd=new FileReader();
  rd.onerror=()=>rej(new Error("read"));
  rd.onload=()=>{
    const img=new Image();
    img.onerror=()=>rej(new Error("decode"));
    img.onload=()=>{
      const side=Math.min(img.width,img.height),cv=document.createElement("canvas");
      cv.width=cv.height=256;
      cv.getContext("2d").drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,256,256);
      cv.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",.85);
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
});

const normTime=v=>{
  if(v===null||v===undefined)return"";
  let t=String(v).trim();
  if(!t||t==="-"||t==="—"||t.toLowerCase()==="nan")return"";
  const m=t.match(/(\d{1,2}):(\d{2})/);
  return m?`${pad(Number(m[1]))}:${m[2]}`:"";
};
const normDate=v=>{
  if(v===null||v===undefined)return"";
  if(v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  const t=String(v).trim();
  let m=t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad(Number(m[2]))}-${pad(Number(m[3]))}`;
  m=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${pad(Number(m[2]))}-${pad(Number(m[1]))}`;
  return "";
};
const pickCols=head=>{
  const f=k=>head.findIndex(h=>h&&String(h).indexOf(k)>-1);
  return {d:f("ວັນທີ"),i:f("ກົດເຂົ້າ"),o:f("ກົດອອກ"),n:f("ຊື່")};
};
const rowsToHR=(head,body)=>{

  body.forEach(r=>{

    out.push({date,cin:normTime(r[c.i]),cout:normTime(r[c.o]),name:c.n>-1?String(r[c.n]||"").trim():""});
  });
  return out;
};
/* ໄຟລ໌ .xls ຂອງ ທພລ ຕົວຈິງແມ່ນ HTML — ຮອງຮັບທັງສອງແບບ */
async function readHRFile(file){
  const buf=await file.arrayBuffer();
  const head4=new Uint8Array(buf.slice(0,2));
  if(head4[0]===0x50&&head4[1]===0x4B){          // PK → xlsx ແທ້
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    const ws=wb.worksheets[0];
    const rows=[];
    ws.eachRow(r=>{
      const v=[];
      r.eachCell({includeEmpty:true},c=>v.push(c.value&&c.value.text?c.value.text:c.value));
      rows.push(v);
    });
    if(!rows.length) return null;
    return rowsToHR(rows[0].map(x=>String(x||"")),rows.slice(1));
  }
  const text=new TextDecoder("utf-8").decode(buf);
  const doc=new DOMParser().parseFromString(text,"text/html");
  const table=doc.querySelector("table");
  if(!table) return null;
  const trs=[...table.querySelectorAll("tr")];
  if(trs.length<2) return null;
  const head=[...trs[0].children].map(c=>c.textContent.trim());
  const body=trs.slice(1).map(tr=>[...tr.children].map(c=>c.textContent.trim()));
  return rowsToHR(head,body);
}

/* ທຽບຂໍ້ມູນເຮົາ ກັບ ທພລ */
function buildDiff(hr,ours){
  const dates=hr.map(r=>r.date).sort();
  const from=dates[0],to=dates[dates.length-1];
  const mine=ours.filter(e=>e.date>=from&&e.date<=to);
  const byDate={};
  mine.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e)});
  const items=[];
  let ok=0;

  hr.forEach(h=>{
    const g=byDate[h.date];
    if(!g||!g.length){
      /* ວັນເສົາ-ອາທິດ ນັບເປັນ OT ໝົດ; ວັນທຳມະດາຕ້ອງອອກຫຼັງ 17:30 */
      const noOT=isWE(h.date)
        ? (!h.cout || !h.cin || toM(h.cout)<=toM(h.cin))
        : (!h.cout || toM(h.cout)<toM("17:30"));
      if(!noOT) items.push({type:"missing",date:h.date,hrIn:h.cin,hrOut:h.cout});
      return;
    }
    g.forEach((e,k)=>{
      if(k>0){items.push({type:"dupe",date:e.date,id:e.id,myIn:e.clockIn,myOut:e.endTime,note:e.remarks});return}
      const dIn=(e.clockIn||"")!==(h.cin||""), dOut=(e.endTime||"")!==(h.cout||"");
      if(dIn||dOut) items.push({type:"diff",date:e.date,id:e.id,myIn:e.clockIn,myOut:e.endTime,
                                hrIn:h.cin,hrOut:h.cout,dIn,dOut});
      else ok++;
    });
  });

  const hrDates=new Set(hr.map(r=>r.date));
  mine.forEach(e=>{if(!hrDates.has(e.date)) items.push({type:"extra",date:e.date,id:e.id,myIn:e.clockIn,myOut:e.endTime,note:e.remarks})});

  const order={diff:0,dupe:1,missing:2,extra:3};
  items.sort((a,b)=>order[a.type]-order[b.type]||(a.date<b.date?-1:1));
  return{from,to,ok,items,total:hr.length};
}

    if(!form.date||!form.startTime||!form.endTime){toast("ກະລຸນາເລືອກວັນທີ ແລະ ເວລາກົດອອກ","err");return}
    if(isWE(form.date)&&!form.clockIn){toast("ວັນເສົາ-ອາທິດ ຕ້ອງໃສ່ເວລາກົດເຂົ້າ","err");return}
    setBusy("ກຳລັງບັນທຶກ OT...");
    const entry={...form,id:Date.now()+""};
    setEntries(p=>({...p,[sel]:[...(p[sel]||[]),entry]}));
    setForm(blank);setShowAdd(false);
    try{
      const{error}=await SUPA.from("ot_entries").insert(entryToRow(sel,entry));
      if(error) throw error;
      toast("ບັນທຶກ OT ແລ້ວ");
    }catch(e){
      console.error(e);
      setEntries(p=>({...p,[sel]:(p[sel]||[]).filter(x=>x.id!==entry.id)}));
      toast("ບັນທຶກບໍ່ສຳເລັດ — ລອງໃໝ່ອີກຄັ້ງ","err");
    }finally{setBusy(null)}
  };

  const saveEdit=async()=>{
    if(isWE(editForm.date)&&!editForm.clockIn){toast("ວັນເສົາ-ອາທິດ ຕ້ອງໃສ່ເວລາກົດເຂົ້າ","err");return}
    setBusy("ກຳລັງອັບເດດ...");
    const id=editId;
    setEntries(p=>({...p,[sel]:(p[sel]||[]).map(e=>e.id===id?{...e,...editForm}:e)}));
    setEditId(null);
    try{
      const{error}=await SUPA.from("ot_entries").update({
        date:editForm.date,
        start_time:editForm.startTime,
        clock_in:editForm.clockIn||null,
        end_time:editForm.endTime,
        remarks:editForm.remarks
      }).eq("id",id);
      if(error) throw error;
      toast("ອັບເດດແລ້ວ");
    }catch(e){console.error(e);loadAll(true);toast("ອັບເດດບໍ່ສຳເລັດ","err")}
    finally{setBusy(null)}
  };

  const del=async(id)=>{
    setConfirmId(null);
    setBusy("ກຳລັງລົບ...");
    setEntries(p=>({...p,[sel]:(p[sel]||[]).filter(e=>e.id!==id)}));
    try{
      const{error}=await SUPA.from("ot_entries").delete().eq("id",id);
      if(error) throw error;
      toast("ລົບລາຍການແລ້ວ");
    }catch(e){console.error(e);loadAll(true);toast("ລົບບໍ່ສຳເລັດ","err")}
    finally{setBusy(null)}
  };

  const doExport=async()=>{
    if(!emp)return;
    setBusy("ກຳລັງສ້າງໄຟລ໌ Excel...");
    try{await exportXL(emp,entries,startDate,endDate);toast("ດາວໂຫຼດ Excel ແລ້ວ")}
    catch(e){console.error(e);toast("Export ບໍ່ສຳເລັດ","err")}
    finally{setBusy(null)}
  };

  /* ── ຮູບພະນັກງານ: Supabase Storage + ຖັນ photo_url ── */
  const pathOf=url=>{const i=url&&url.indexOf("/"+BUCKET+"/");return i>-1?url.slice(i+BUCKET.length+2).split("?")[0]:""};

  const onPickPhoto=async e=>{
    const f=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!f||!emp)return;
    setBusy("ກຳລັງອັບໂຫຼດຮູບ...");
    try{
      const blob=await resizePhoto(f);
      const path=`${sel}-${Date.now()}.jpg`;
      const up=await SUPA.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",upsert:true});
      if(up.error) throw up.error;
      const url=SUPA.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
      const old=emp.photo_url;
      const{error}=await SUPA.from("employees").update({photo_url:url}).eq("id",sel);
      if(error) throw error;
      setEmps(es=>es.map(x=>x.id===sel?{...x,photo_url:url}:x));
      const op=pathOf(old);
      if(op) SUPA.storage.from(BUCKET).remove([op]);
      toast("ອັບເດດຮູບພະນັກງານແລ້ວ");
    }catch(err){
      console.error(err);
      toast("ອັບໂຫຼດຮູບບໍ່ສຳເລັດ — ກວດ bucket ແລະ policy","err");
    }finally{setBusy(null)}
  };

  const removePhoto=async()=>{
    if(!emp)return;
    setAvMenu(false);
    setBusy("ກຳລັງລຶບຮູບ...");
    try{
      const op=pathOf(emp.photo_url);
      const{error}=await SUPA.from("employees").update({photo_url:null}).eq("id",sel);
      if(error) throw error;
      setEmps(es=>es.map(x=>x.id===sel?{...x,photo_url:""}:x));
      if(op) SUPA.storage.from(BUCKET).remove([op]);
      toast("ລຶບຮູບແລ້ວ");
    }catch(err){console.error(err);toast("ລຶບຮູບບໍ່ສຳເລັດ","err")}
    finally{setBusy(null)}
  };

  /* ── ກວດກັບລະບົບ ທພລ ── */
  const onHRFile=async e=>{
    const f=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!f)return;
    setBusy("ກຳລັງອ່ານໄຟລ໌ ທພລ...");
    try{
      const hr=await readHRFile(f);
      if(!hr||!hr.length) throw new Error("no rows");
      const hrName=(hr.find(r=>r.name)||{}).name||"";
      setCheck({open:true,report:buildDiff(hr,entries[sel]||[]),hrName,file:f.name});
    }catch(err){
      console.error(err);
      setCheck({open:true,err:"ອ່ານໄຟລ໌ບໍ່ໄດ້ — ກວດວ່າແມ່ນໄຟລ໌ທີ່ໂຫຼດຈາກລະບົບ ທພລ ໂດຍກົງ"});
    }finally{setBusy(null)}
  };

  const markDone=it=>setCheck(c=>({...c,report:{...c.report,
    items:c.report.items.map(x=>x===it?{...x,done:true}:x)}}));

  const applyOne=async it=>{
    if(it.type==="diff"){
      const{error}=await SUPA.from("ot_entries")
        .update({clock_in:it.hrIn||null,end_time:it.hrOut}).eq("id",it.id);
      if(error) throw error;
      setEntries(p=>({...p,[sel]:(p[sel]||[]).map(e=>e.id===it.id?{...e,clockIn:it.hrIn,endTime:it.hrOut,clockOut:it.hrOut}:e)}));
    }else if(it.type==="missing"){
      const we=isWE(it.date);
      const entry={id:Date.now()+""+Math.floor(Math.random()*999),date:it.date,
        startTime:we?WE_START:"17:30",clockIn:it.hrIn,clockOut:it.hrOut,endTime:it.hrOut,remarks:""};
      const{error}=await SUPA.from("ot_entries").insert(entryToRow(sel,entry));
      if(error) throw error;
      setEntries(p=>({...p,[sel]:[...(p[sel]||[]),entry]}));
    }else if(it.type==="dupe"){
      const{error}=await SUPA.from("ot_entries").delete().eq("id",it.id);
      if(error) throw error;
      setEntries(p=>({...p,[sel]:(p[sel]||[]).filter(e=>e.id!==it.id)}));
    }
    markDone(it);
  };

  const fixOne=async it=>{
    setBusy("ກຳລັງແກ້...");
    try{await applyOne(it);toast("ແກ້ແລ້ວ")}
    catch(e){console.error(e);toast("ແກ້ບໍ່ສຳເລັດ","err")}
    finally{setBusy(null)}
  };

  const fixAll=async()=>{
    const todo=check.report.items.filter(x=>!x.done&&(x.type==="diff"||x.type==="missing"));
    if(!todo.length)return;
    setBusy(`ກຳລັງແກ້ ${todo.length} ລາຍການ...`);
    let n=0;
    try{
      for(const it of todo){await applyOne(it);n++}
      toast(`ແກ້ສຳເລັດ ${n} ລາຍການ`);
    }catch(e){console.error(e);toast(`ແກ້ໄດ້ ${n} ລາຍການ ແລ້ວມີບັນຫາ`,"err")}
    finally{setBusy(null)}
  };

  const openAdd=()=>{setForm(blank);setShowAdd(true)};
  const openEdit=r=>{setEditId(r.id);setEditForm({date:r.date,startTime:r.startTime,clockIn:r.clockIn||"",clockOut:r.clockOut||"",endTime:r.endTime,remarks:r.remarks||""})};

  if(loading) return null;

  const stats=[
    {c:"var(--brand)",lb:"ລວມໂອທີທັງໝົດ",v:toS(tmins)||"0:00",s:`${list.length} ວັນ`},
    {c:C.eve,  lb:"ວັນຈັນ-ສຸກ",v:toS(btot[0])||"0:00",s:"17:30–22:00"},
    {c:C.night,lb:"ວັນຈັນ-ສຸກ",v:toS(btot[1])||"0:00",s:"22:00–6:00"},
    {c:C.wam,  lb:"ເສົາ–ອາທິດ", v:toS(btot[2]+btot[3])||"0:00",s:"08:00–16:00"},
  ];

  return(
  <div className="app">
    {isMob&&sideOpen&&<div className="scrim" onClick={()=>setSideOpen(false)}/>}

    {/* ══ SIDEBAR ══ */}
    <aside className={"side"+(sideOpen?" open":"")}>
      <div className="side-head">
        <div className="brandbox">
          {LOGO&&LOGO.indexOf("data:")===0
            ? <img src={LOGO} alt="LDB"/>
            : <div className="mono">LDB</div>}
          <div>
            <b>ທະນາຄານພັດທະນາລາວ</b>
            <span>PHONESAVANH BRANCH</span>
          </div>
        </div>
      </div>

      <div className="legend">
        <p>ແຕ່ລະຊ່ວງເວລາ</p>
        {BANDS.map((b,i)=>(
          <div key={i}><i style={{background:b.c}}/><span>{b.l}</span>
            <span style={{marginLeft:"auto",fontSize:10,color:"rgba(255,255,255,.45)"}}>{b.wk?"ວັນຈັນ-ສຸກ":"ສ/ອ"}</span>
          </div>
        ))}
      </div>

      <div className="side-title">ລາຍຊື່ ພະນັກງານ</div>
      <div className="emps">
        {emps.map(e=>(
          <button key={e.id} className={"emp"+(e.id===sel?" on":"")}
            onClick={()=>{setSel(e.id);if(isMob)setSideOpen(false)}}>
            <Avatar emp={e} photo={e.photo_url} size={32} dark/>
            <span className="txt">
              <b>{e.name}</b>
              <span>{cnt(e.id)} ລາຍການໃນຮອບນີ້</span>
            </span>
          </button>
        ))}
      </div>

      <div className="side-foot"><ILogout s={13}/> ລະບົບ OT ພາຍໃນສາຂາ</div>
    </aside>

    {/* ══ MAIN ══ */}
    <div className="main">
      <header className="top">
        {isMob&&<button className="burger" onClick={()=>setSideOpen(o=>!o)} aria-label="ເມນູ"><i/><i/><i/></button>}
        {emp&&(
          <button ref={avRef} className="avwrap" onClick={()=>setAvMenu(true)} title="ຮູບພະນັກງານ">
            <Avatar emp={emp} photo={emp.photo_url} size={isMob?34:40}/>
            <span className="cam"><ICam s={9} w={2.4}/></span>
          </button>
        )}
        <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={onPickPhoto}/>
        <div style={{flex:1,minWidth:0}}>
          <h1>{emp?emp.name:"ລະບົບ OT"}</h1>
        </div>
        {!isMob&&(
          <div className="range">
            <DateField value={startDate} onChange={setStartDate} isMob={isMob} mini/>
            <em>→</em>
            <DateField value={endDate} onChange={setEndDate} isMob={isMob} mini/>
          </div>
        )}
        {!isMob&&(
          <label className="btn btn-g" title="ທຽບກັບໄຟລ໌ຈາກລະບົບ ທພລ">
            <ICheck/> ກວດກັບ ທພລ
            <input type="file" accept=".xls,.xlsx,.html,.htm" style={{display:"none"}} onChange={onHRFile}/>
          </label>
        )}
        {!isMob&&<button className="btn btn-g" onClick={doExport}><IDl/> Excel</button>}
        {!isMob&&<button className="btn btn-p" onClick={openAdd}><IPlus/> ເພີ່ມ OT</button>}
      </header>

      {isMob&&(
        <div className="subbar">
          <div className="range">
            <DateField value={startDate} onChange={setStartDate} isMob={isMob} mini/>
            <em>→</em>
            <DateField value={endDate} onChange={setEndDate} isMob={isMob} mini/>
          </div>
        </div>
      )}

      <div className="scroll">
        <section className="stats">
          {stats.map((s,i)=>(
            <div className="stat" key={i} style={{"--c":s.c}}>
              <div className="lb"><i/>{s.lb}</div>
              <div className="v num">{s.v}</div>
              <div className="s">{s.s}</div>
            </div>
          ))}
        </section>

        {list.length===0?(
          <div className="empty">
            <div style={{display:"flex",justifyContent:"center"}}><Clock size={56}/></div>
            <b>ຍັງບໍ່ມີລາຍການ OT ໃນຮອບນີ້</b>
            <p>{startDate} → {endDate}</p>
            <button className="btn btn-p" onClick={openAdd}><IPlus/> ເພີ່ມລາຍການທຳອິດ</button>
          </div>
        ):isMob?(
          <div className="rows">
            {list.map(r=>{
              const b=bandsOf(r);
              const tot=b.reduce((a,x)=>a+x,0);
              const we=isWE(r.date);
              return(
                <div className={"row"+(we?" we":"")} key={r.id}>
                  <div className="row-h">
                    <div>
                      <div className="d num">{fmtD(r.date)}</div>
                      <div className="w">ວັນ{dayL(r.date)} {we?"· ເສົາ-ອາທິດ":""}</div>
                    </div>
                    <div className="t num">{toS(tot)||"0:00"}</div>
                  </div>
                  <div className="times">
                    <div className="tbox"><span>ເລີ່ມ OT</span><b className="num">{otStart(r)}</b></div>
                    <div className="tbox"><span>ກົດເຂົ້າ</span><b className="num">{r.clockIn||"—"}</b></div>
                    <div className="tbox"><span>ກົດອອກ</span><b className="num">{r.endTime||"—"}</b></div>
                  </div>
                  <div className="bands">
                    {BANDS.map((bd2,i)=>b[i]>0&&(
                      <span className="band num" key={i} style={{background:bd2.c}}>{bd2.l} · {toS(b[i])}</span>
                    ))}
                  </div>
                  {r.remarks&&<div style={{marginTop:9,fontSize:12,color:"var(--muted)"}}>ໝາຍເຫດ: {r.remarks}</div>}
                  <div className="row-a">
                    <button className="e" onClick={()=>openEdit(r)}><IEdit s={14}/> ແກ້ໄຂ</button>
                    <button className="r" onClick={()=>setConfirmId(r.id)}><IDel s={14}/> ລົບ</button>
                  </div>
                </div>
              );
            })}
            <div className="card" style={{padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <b style={{fontSize:13}}>ລວມທັງໝົດ</b>
              <b className="num" style={{fontSize:20,color:"var(--brand)"}}>{toS(tmins)||"0:00"}</b>
            </div>
          </div>
        ):(
          <div className="card">
            <div className="card-h">
              <b>ຕາຕະລາງ OT</b>
              <span className="cnt num">{list.length} ລາຍການ</span>
            </div>
            <div style={{overflowX:"auto",maxHeight:"calc(100vh - 300px)"}}>
              <table>
                <thead>
                  <tr>
                    <th>ວັນທີ</th><th>ວັນ</th>
                    <th className="c">ເລີ່ມ OT</th><th className="c">ກົດເຂົ້າ</th><th className="c">ກົດອອກ</th>
                    {BANDS.map((b,i)=>(
                      <th className="c" key={i} style={{color:b.c}}>{b.l}<span className="sm">{b.wk?"ວັນຈັນ-ສຸກ":"ເສົາ–ອາທິດ"}</span></th>
                    ))}
                    <th>ໝາຍເຫດ</th><th className="c"></th>
                  </tr>
                </thead>
                <tbody>
                  {list.map(r=>{
                    const b=bandsOf(r);
                    const we=isWE(r.date);
                    return(
                      <tr key={r.id} className={we?"we":""}>
                        <td className="num" style={{color:"var(--ink)",fontWeight:600}}>{fmtD(r.date)}</td>
                        <td><span className="daytag">{we&&<i/>}{dayL(r.date)}</span></td>
                        <td className="c num">{otStart(r)}</td>
                        <td className="c num">{r.clockIn||<span className="off">—</span>}</td>
                        <td className="c num" style={{fontWeight:600,color:"var(--ink)"}}>{r.endTime||<span className="off">—</span>}</td>
                        {BANDS.map((bd2,i)=>(
                          <td className="c" key={i}>
                            {b[i]>0
                              ? <span className="chip num" style={{background:bd2.c}}>{toS(b[i])}</span>
                              : <span className="off">—</span>}
                          </td>
                        ))}
                        <td style={{maxWidth:160,overflow:"hidden",textOverflow:"ellipsis"}}>{r.remarks||<span className="off">—</span>}</td>
                        <td className="c">
                          <button className="ico" style={{color:"var(--brand)"}} onClick={()=>openEdit(r)} title="ແກ້ໄຂ"><IEdit/></button>
                          <button className="ico del" style={{color:"var(--danger)"}} onClick={()=>setConfirmId(r.id)} title="ລົບ"><IDel/></button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
                <tfoot>
                  <tr>
                    <td colSpan={5} style={{textAlign:"right"}}>ລວມທັງໝົດ · {toS(tmins)||"0:00"} ຊົ່ວໂມງ</td>
                    {BANDS.map((bd2,i)=>(
                      <td className="c num" key={i} style={{color:btot[i]>0?bd2.c:"#C6D3DF"}}>{toS(btot[i])||"—"}</td>
                    ))}
                    <td colSpan={2}></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        )}
      </div>

      {isMob&&(
        <div className="mbar">
          <label className="btn btn-g" style={{flex:1}}>
            <ICheck/> ກວດ
            <input type="file" accept=".xls,.xlsx,.html,.htm" style={{display:"none"}} onChange={onHRFile}/>
          </label>
          <button className="btn btn-g" onClick={doExport}><IDl/> Excel</button>
          <button className="btn btn-p" onClick={openAdd}><IPlus/> ເພີ່ມ OT</button>
        </div>
      )}
    </div>

    {/* ══ ADD / EDIT ══ */}
    {(showAdd||editId)&&(()=>{
      const isEdit=!!editId;
      const f=isEdit?editForm:form;
      const setF=isEdit?setEditForm:setForm;
      const we=f.date?isWE(f.date):false;
      const pb=calcBands(f.startTime,f.endTime,f.date,f.clockIn);
      const pt=pb.reduce((a,x)=>a+x,0);
      const fromClock=we&&f.clockIn&&toM(f.clockIn)>toM(WE_START);
      const close=()=>isEdit?setEditId(null):setShowAdd(false);
      return(
        <div className="mask" onClick={e=>{if(e.target===e.currentTarget)close()}}>
          <div className="modal">
            {isMob&&<div className="grab"/>}
            <div className="modal-h">
              <div>
                <b>{isEdit?"ແກ້ໄຂລາຍການ OT":"ເພີ່ມລາຍການ OT"}</b>
                <span>{emp?.name}</span>
              </div>
              <button className="ico" onClick={close} style={{color:"var(--muted)"}}><IX/></button>
            </div>
            <div className="modal-b">
              <div className="fset">
                <label className="lbl">ວັນທີ</label>
                <DateField value={f.date} isMob={isMob}
                  onChange={v=>{
                    const wend=v?isWE(v):false;
                    setF(x=>({...x,date:v,startTime:wend?WE_START:"17:30"}));
                  }}/>
              </div>

              <div className="grid2 fset">
                <div>
                  <label className="lbl">ເລີ່ມ OT {fromClock?"(ຈາກກົດເຂົ້າ)":"(ຄົງທີ່)"}</label>
                  <input className="fld num" readOnly value={otStart(f)}/>
                </div>
                <div>
                  <label className="lbl">ກົດເຂົ້າ {we?"(ຈຳເປັນ)":"(ຖ້າມີ)"}</label>
                  <TimeField value={f.clockIn} keyStyle={we}
                    onChange={v=>setF(x=>({...x,clockIn:v}))}/>
                </div>
              </div>

              {we&&(
                <div className="hintbox" style={{marginTop:-6,marginBottom:14}}>
                  ວັນເສົາ-ອາທິດ ຈະນັບ OT ຈາກ <b>ເວລາກົດເຂົ້າ</b> ຫາ ເວລາກົດອອກ
                  (ຖ້າກົດເຂົ້າກ່ອນ 08:00 ຈະເລີ່ມນັບທີ່ 08:00)
                </div>
              )}

              <div className="fset">
                <label className="lbl">ກົດອອກ</label>
                <TimeField value={f.endTime} keyStyle
                  onChange={v=>setF(x=>({...x,endTime:v,clockOut:v}))}/>
              </div>

              {pt>0&&(
                <div className="preview">
                  <div className="k">ຊົ່ວໂມງ OT ທີ່ຈະບັນທຶກ</div>
                  <div className="v num">{toS(pt)} ຊົ່ວໂມງ</div>
                  <div className="bands">
                    {BANDS.map((b,i)=>pb[i]>0&&(
                      <span className="band num" key={i} style={{background:b.c}}>{b.l} · {toS(pb[i])}</span>
                    ))}
                  </div>
                </div>
              )}

              <div className="fset" style={{marginBottom:0}}>
                <label className="lbl">ໝາຍເຫດ</label>
                <input className="fld" type="text" placeholder="ຕົວຢ່າງ: ຮັບແຂກສຳນັກງານໃຫຍ່"
                  value={f.remarks} onChange={e=>setF(x=>({...x,remarks:e.target.value}))}/>
              </div>
            </div>
            <div className="modal-f">
              <button className="btn btn-q" onClick={close}>ຍົກເລີກ</button>
              <button className="btn btn-p" style={{flex:2}} onClick={isEdit?saveEdit:saveEntry}>
                {isEdit?"ບັນທຶກການແກ້ໄຂ":"ບັນທຶກ OT"}
              </button>
            </div>
          </div>
        </div>
      );
    })()}

    {/* ══ CONFIRM DELETE ══ */}
    {confirmId&&(()=>{
      const r=list.find(x=>x.id===confirmId);
      return(
        <div className="mask" onClick={e=>{if(e.target===e.currentTarget)setConfirmId(null)}}>
          <div className="modal" style={{width:390}}>
            {isMob&&<div className="grab"/>}
            <div className="modal-h">
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{width:36,height:36,borderRadius:11,background:"#FEECEC",color:"var(--danger)",display:"flex",alignItems:"center",justifyContent:"center"}}><IAlert s={18}/></span>
                <div><b>ລົບລາຍການ OT</b><span>ລົບແລ້ວກູ້ຄືນບໍ່ໄດ້</span></div>
              </div>
            </div>
            <div className="modal-b">
              {r&&(
                <div className="warn">
                  <div>ວັນທີ · <b className="num">{fmtD(r.date)}</b> (ວັນ{dayL(r.date)})</div>
                  <div>ເວລາ · <b className="num">{otStart(r)} → {r.endTime}</b></div>
                  <div>ລວມ · <b className="num">{toS(bandsOf(r).reduce((a,b)=>a+b,0))||"0:00"}</b> ຊົ່ວໂມງ</div>
                </div>
              )}
            </div>
            <div className="modal-f">
              <button className="btn btn-q" onClick={()=>setConfirmId(null)}>ຍົກເລີກ</button>
              <button className="btn btn-d" onClick={()=>del(confirmId)}><IDel s={15}/> ລົບອອກ</button>
            </div>
          </div>
        </div>
      );
    })()}

    {/* ══ ຜົນກວດກັບ ທພລ ══ */}
    {check&&check.open&&(()=>{
      const rp=check.report;
      const nameOff=rp&&check.hrName&&emp&&
        check.hrName.replace(/\s/g,"")!==emp.name.replace(/\s/g,"");
      const left=rp?rp.items.filter(x=>!x.done&&(x.type==="diff"||x.type==="missing")).length:0;
      const cnt=t=>rp?rp.items.filter(x=>x.type===t).length:0;
      return(
        <div className="mask" onClick={e=>{if(e.target===e.currentTarget)setCheck(null)}}>
          <div className="modal" style={{width:560}}>
            {isMob&&<div className="grab"/>}
            <div className="modal-h">
              <div>
                <b>ຜົນກວດກັບລະບົບ ທພລ</b>
                <span>{emp?.name}{rp?` · ${fmtD(rp.from)} – ${fmtD(rp.to)}`:""}</span>
              </div>
              <button className="ico" onClick={()=>setCheck(null)} style={{color:"var(--muted)"}}><IX/></button>
            </div>
            <div className="modal-b">
              {check.err&&<div className="warn">{check.err}</div>}
              {rp&&(<>
                {nameOff&&(
                  <div className="ckwarn">
                    ⚠ ຊື່ໃນໄຟລ໌ແມ່ນ <b>{check.hrName}</b> ແຕ່ພະນັກງານທີ່ເລືອກຢູ່ແມ່ນ <b>{emp.name}</b> — ກວດເບິ່ງວ່າອັບໄຟລ໌ຖືກຄົນບໍ່
                  </div>
                )}
                <div className="sum">
                  <span style={{color:"#2E7D32"}}>ກົງກັນ <b>{rp.ok}</b></span>
                  <span style={{color:CKMETA.diff.c}}>ຕ່າງກັນ <b>{cnt("diff")}</b></span>
                  <span style={{color:CKMETA.dupe.c}}>ວັນທີຊ້ຳ <b>{cnt("dupe")}</b></span>
                  <span style={{color:CKMETA.missing.c}}>ຂາດ <b>{cnt("missing")}</b></span>
                  <span style={{color:CKMETA.extra.c}}>ບໍ່ມີໃນ ທພລ <b>{cnt("extra")}</b></span>
                </div>

                {rp.items.length===0&&(
                  <div className="warn" style={{background:"#F1FAF2",borderColor:"#C9E6CE",color:"#1B5E20"}}>
                    ✓ ຂໍ້ມູນກົງກັບລະບົບ ທພລ ທຸກລາຍການ ({rp.ok} ວັນ) ບໍ່ຕ້ອງແກ້ຫຍັງ
                  </div>
                )}

                {rp.items.map((it,i)=>{
                  const m=CKMETA[it.type];
                  return(
                    <div className={"ck"+(it.done?" done":"")} key={i} style={{"--c":m.c}}>
                      <div className="h">
                        <div className="d num">{fmtD(it.date)}<em>ວັນ{dayL(it.date)}</em></div>
                        <div className="tag">{it.done?"✓ ແກ້ແລ້ວ":m.t}</div>
                      </div>

                      {it.type==="diff"&&(
                        <div className="cmp">
                          <span><u>ກົດເຂົ້າ</u> {it.dIn?<><s className="num">{it.myIn||"—"}</s> → <b className="num">{it.hrIn||"—"}</b></>:<span className="num">{it.myIn||"—"}</span>}</span>
                          <span><u>ກົດອອກ</u> {it.dOut?<><s className="num">{it.myOut||"—"}</s> → <b className="num">{it.hrOut||"—"}</b></>:<span className="num">{it.myOut||"—"}</span>}</span>
                        </div>
                      )}
                      {it.type==="missing"&&(
                        <div className="cmp">
                          <span><u>ທພລ</u> <span className="num">{it.hrIn||"—"} → {it.hrOut}</span></span>
                          <span><u>OT ທີ່ຈະໄດ້</u> <b className="num" style={{color:"var(--brand)"}}>
                            {toS(calcBands(isWE(it.date)?WE_START:"17:30",it.hrOut,it.date,it.hrIn).reduce((a,x)=>a+x,0))||"0:00"}</b></span>
                        </div>
                      )}
                      {(it.type==="dupe"||it.type==="extra")&&(
                        <div className="cmp">
                          <span><u>ຂອງເຮົາ</u> <span className="num">{it.myIn||"—"} → {it.myOut||"—"}</span></span>
                          {it.note&&<span><u>ໝາຍເຫດ</u> {it.note}</span>}
                          {it.type==="extra"&&<span style={{color:"var(--muted)"}}>ຢືນຢັນດ້ວຍ ທພລ ບໍ່ໄດ້ (ວັນພັກ/ວຽກນອກລະບົບ)</span>}
                        </div>
                      )}

                      {!it.done&&it.type==="diff"&&<button className="act" onClick={()=>fixOne(it)}>ແກ້ໃຫ້ກົງ ທພລ</button>}
                      {!it.done&&it.type==="missing"&&<button className="act" onClick={()=>fixOne(it)}>ເພີ່ມລາຍການນີ້</button>}
                      {!it.done&&it.type==="dupe"&&<button className="act" style={{color:"var(--danger)"}} onClick={()=>fixOne(it)}>ລົບແຖວຊ້ຳ</button>}
                    </div>
                  );
                })}
              </>)}
            </div>
            <div className="modal-f">
              <button className="btn btn-q" onClick={()=>setCheck(null)}>ປິດ</button>
              {left>0&&<button className="btn btn-p" style={{flex:2}} onClick={fixAll}>ແກ້ທັງໝົດ ({left})</button>}
            </div>
          </div>
        </div>
      );
    })()}

    {/* ══ ເມນູຮູບພະນັກງານ ══ */}
    {avMenu&&(
      <Pop anchor={avRef.current} isMob={isMob} onClose={()=>setAvMenu(false)} width={228}>
        {isMob&&<div className="grab"/>}
        <div className="menu">
          <label className="pick">
            <ICam s={16}/> {emp&&emp.photo_url?"ປ່ຽນຮູບ":"ອັບໂຫຼດຮູບ"}
            <input type="file" accept="image/*" style={{display:"none"}}
              onChange={e=>{setAvMenu(false);onPickPhoto(e)}}/>
          </label>
          {emp&&emp.photo_url&&(
            <button className="rm" onClick={removePhoto}><IDel s={16}/> ລຶບຮູບອອກ</button>
          )}
        </div>
      </Pop>
    )}

    {/* ══ ກຳລັງບັນທຶກ / ໂຫຼດ ══ */}
    {busy&&(
      <div className="busy">
        <Clock size={22} color="#fff" track="rgba(255,255,255,.28)" w={2.6} ticks={false}/>
        {busy}
      </div>
    )}

    <div className="toasts">
      {toasts.map(t=>(
        <div key={t.id} className={"toast "+t.type}>{t.msg}</div>
      ))}
    </div>
  </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
