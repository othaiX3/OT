const toM=t=>{if(!t)return 0;const[h,m]=t.split(":").map(Number);return h*60+(m||0)};
const toS=m=>{if(!m||m<=0)return"";const h=Math.floor(m/60),n=Math.round(m%60);return`${h}:${n.toString().padStart(2,"0")}`};

/*
  4 ຊ່ວງ OT:
  [0] 17:30–22:00  → ທຸກວັນ (ຈັນ–ສຸກ ແລະ ເສົາ–ອາທິດ)
  [1] 22:00–06:00  → ທຸກວັນ
  [2] 08:00–12:00  → ເສົາ–ອາທິດ ເທົ່ານັ້ນ
  [3] 12:00–16:00  → ເສົາ–ອາທິດ ເທົ່ານັ້ນ
*/
const BANDS=[
  {l:"17:30–22:00", s:17*60+30, e:22*60,        wk:true,  we:true },
  {l:"22:00–06:00", s:22*60,    e:24*60+6*60,   wk:true,  we:true },
  {l:"08:00–12:00", s:8*60,     e:12*60,        wk:false, we:true },
  {l:"12:00–16:00", s:12*60,    e:16*60,        wk:false, we:true },
];

const isWE=d=>[0,6].includes(new Date(d).getDay());

function calcBands(s0,e0,dateStr){
  if(!s0||!e0)return[0,0,0,0];
  const we=dateStr?isWE(dateStr):false;
  // weekend: ສະເໝີໃຊ້ 08:00 ເປັນຈຸດເລີ່ມ
  const es=we?"08:00":s0;
  const s=toM(es);let e=toM(e0);
  // ຂ້າມຄືນ:
  // weekday: start>=12:00 (ແລງ) AND end<12:00 (ເຊົ້າ)
  // weekend: start=08:00, end<start AND end<12:00 (ຕໍ່ຈາກມື້ກ່ອນ)
  if(e<s && e<12*60 && (s>=12*60 || we)) e+=1440;
  return BANDS.map(b=>{
    if(we?!b.we:!b.wk)return 0;
    const o1=Math.max(0,Math.min(e,b.e)-Math.max(s,b.s));
    const o2=Math.max(0,Math.min(e,b.e+1440)-Math.max(s,b.s+1440));
    return o1+o2;
  });
}

const DAYS=["ອາທິດ","ຈັນ","ອັງຄານ","ພຸດ","ພະຫັດ","ສຸກ","ເສົາ"];
const MONTHS=["ມັງກອນ","ກຸມພາ","ມີນາ","ເມສາ","ພຶດສະພາ","ມິຖຸນາ","ກໍລະກົດ","ສິງຫາ","ກັນຍາ","ຕຸລາ","ພະຈິກ","ທັນວາ"];
const dayL=d=>DAYS[new Date(d).getDay()];
const fmtD=d=>{const t=new Date(d);return`${t.getDate()}/${t.getMonth()+1}/${t.getFullYear()}`};
const ini=n=>n.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase().substring(0,2);

async function exportXL(emp,all,startDate,endDate){
  const rows=(all[emp.id]||[])
    .filter(e=>e.date>=startDate&&e.date<=endDate)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("OT");

  ws.columns=[
    {width:13},{width:9},{width:10},{width:10},{width:10},
    {width:13},{width:13},{width:13},{width:13},{width:18}
  ];

  const thin={style:"thin",color:{argb:"FF000000"}};
  const bd={top:thin,bottom:thin,left:thin,right:thin};

  const cell=(row,col,val,bold,align,wrap)=>{
    const c=row.getCell(col);
    c.value=val;
    c.font={name:"Phetsarath OT",bold:!!bold,size:10,color:{argb:"FF000000"}};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
    c.alignment={horizontal:align||"center",vertical:"middle",wrapText:!!wrap};
    c.border=bd;
  };

  // ── Header ──
  const hr=ws.addRow([]);hr.height=32;
  ["ວັນທີ","ວັນ","ເລີ່ມ OT","ກົດເຂົ້າ","ອອກ",
   "17:30-22:00","22:00-06:00","08:00-12:00 (ສ/ອ)","12:00-16:00 (ສ/ອ)","ໝາຍເຫດ"]
  .forEach((h,i)=>{
    const c=hr.getCell(i+1);
    c.value=h;
    c.font={name:"Phetsarath OT",bold:true,size:10};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
    c.alignment={horizontal:"center",vertical:"middle",wrapText:true};
    c.border=bd;
  });

  // ── Data ──
  const tb=[0,0,0,0];
  rows.forEach(r=>{
    const we=isWE(r.date);
    const b=calcBands(r.startTime||"17:30",r.endTime,r.date);
    b.forEach((x,i)=>tb[i]+=x);
    const dr=ws.addRow([]);dr.height=18;
    [
      [fmtD(r.date),"left"],
      [dayL(r.date),"center"],
      [we?"08:00":(r.startTime||"17:30"),"center"],
      [r.clockIn||"—","center"],
      [r.endTime||"—","center"],
      [b[0]>0?toS(b[0]):"—","center",true],
      [b[1]>0?toS(b[1]):"—","center",true],
      [we?(b[2]>0?toS(b[2]):"—"):"—","center"],
      [we?(b[3]>0?toS(b[3]):"—"):"—","center"],
      [r.remarks||"","left"]
    ].forEach(([v,al,bold],i)=>{
      const c=dr.getCell(i+1);
      c.value=v;
      c.font={name:"Phetsarath OT",bold:!!bold,size:10};
      c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
      c.alignment={horizontal:al,vertical:"middle"};
      c.border=bd;
    });
  });

  // ── Total ──
  const tr=ws.addRow([]);tr.height=20;
  // Merge A-E (cols 1-5) for ລວມທັງໝົດ label
  ws.mergeCells(tr.number,1,tr.number,5);
  // Set values for band cols only
  [tb[0]>0?toS(tb[0]):"—",tb[1]>0?toS(tb[1]):"—",
   tb[2]>0?toS(tb[2]):"—",tb[3]>0?toS(tb[3]):"—",""]
  .forEach((v,i)=>{
    const c=tr.getCell(i+6);
    c.value=v;
    c.font={name:"Phetsarath OT",bold:true,size:10};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
    c.alignment={horizontal:"center",vertical:"middle"};
    c.border=bd;
  });
  // Merged label cell
  const lbl=tr.getCell(1);
  lbl.value="ລວມທັງໝົດ";
  lbl.font={name:"Phetsarath OT",bold:true,size:10};
  lbl.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
  lbl.alignment={horizontal:"center",vertical:"middle"};
  lbl.border=bd;

  // ── Export ──
  const buf=await wb.xlsx.writeBuffer();
  const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  const a=document.createElement("a");a.href=url;
  a.download=`OT_${emp.name}_${startDate}_${endDate}.xlsx`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

const rowToEntry=r=>({id:r.id,date:r.date,startTime:r.start_time,clockIn:r.clock_in||"",clockOut:r.clock_out||"",endTime:r.end_time,remarks:r.remarks||""});

    try{
      const v=localStorage.getItem("ldb_ver");
      if(v!=="v2") return INIT; // force reset on first load
      return JSON.parse(localStorage.getItem("ldb_emps"))||INIT;
    }catch{return INIT}
  });
  const[entries,setEntries]=useState({});
  const[sel,setSel]=useState("1");

  const[startDate,setStartDate]=useState(()=>{
    const d=new Date();
    const y=d.getDate()<=20?d.getFullYear():(d.getMonth()===11?d.getFullYear()+1:d.getFullYear());
    const m=d.getDate()<=20?(d.getMonth()===0?11:d.getMonth()-1):d.getMonth();
    const yr2=d.getDate()<=20&&d.getMonth()===0?d.getFullYear()-1:y;
    return `${d.getDate()<=20?(d.getMonth()===0?d.getFullYear()-1:d.getFullYear()):d.getFullYear()}-${String(d.getDate()<=20?(d.getMonth()===0?12:d.getMonth()):d.getMonth()+1).padStart(2,"0")}-21`;
  });
  const[endDate,setEndDate]=useState(()=>{
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-20`;
  });
  const[showAdd,setShowAdd]=useState(false);
  const[showEmp,setShowEmp]=useState(false);
  const[form,setForm]=useState({date:"",startTime:"17:30",clockIn:"",clockOut:"",endTime:"",remarks:""});
  const[empN,setEmpN]=useState("");
  const[sideOpen,setSideOpen]=useState(false);
  const[editId,setEditId]=useState(null);
  const[editForm,setEditForm]=useState({date:"",startTime:"",clockIn:"",clockOut:"",endTime:"",remarks:""});
  const[confirmId,setConfirmId]=useState(null);
  const[isMob,setIsMob]=useState(window.innerWidth<640);
  const[loading,setLoading]=useState(true);
  const[syncing,setSyncing]=useState(false);
  useEffect(()=>{const h=()=>setIsMob(window.innerWidth<640);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);

  // ── Load all entries from Supabase ──────────────────
  const loadAll=async()=>{
    try{
      const{data,error}=await SUPA.from("ot_entries").select("*");
      if(error) throw error;
      const map={};
      (data||[]).forEach(r=>{
        if(!map[r.emp_id]) map[r.emp_id]=[];
        map[r.emp_id].push(rowToEntry(r));
      });
      // ລຽງຕາມວັນທີ
      Object.keys(map).forEach(id=>{
        map[id].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
      });
      setEntries(map);
    }catch(e){console.error("load error",e);}
    finally{setLoading(false);}
  };

  useEffect(()=>{
    loadAll();
    // ── Real-time subscription ──────────────────────
    const channel=SUPA.channel("ot_realtime")
      .on("postgres_changes",{event:"*",schema:"public",table:"ot_entries"},()=>{
        loadAll();
      })
      .subscribe();
    return()=>SUPA.removeChannel(channel);
  },[]);

  // employees still from INIT (fixed list)
  useEffect(()=>{
    const v=localStorage.getItem("ldb_ver");
    if(v!=="v2"){ localStorage.setItem("ldb_ver","v2"); }
  },[]);

  const emp=emps.find(e=>e.id===sel);
  const list=(entries[sel]||[])
    .filter(e=>e.date>=startDate&&e.date<=endDate)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

  const saveEntry=async()=>{
    if(!form.date||!form.startTime||!form.endTime)return;
    setSyncing(true);
    const entry={...form,id:Date.now()+""};
    // optimistic update
    setEntries(p=>({...p,[sel]:[...(p[sel]||[]),entry]}));
    setForm({date:"",startTime:"17:30",clockIn:"",clockOut:"",endTime:"",remarks:""});
    setShowAdd(false);
    try{
      const{error}=await SUPA.from("ot_entries").insert(entryToRow(sel,entry));
      if(error) throw error;
    }catch(e){
      console.error("save error",e);
      // rollback
      setEntries(p=>({...p,[sel]:(p[sel]||[]).filter(x=>x.id!==entry.id)}));
      alert("ບໍ່ສາມາດບັນທຶກໄດ້ — ກວດ network");
    }finally{setSyncing(false);}
  };

    setConfirmId(null);
    // optimistic
    setEntries(p=>({...p,[sel]:(p[sel]||[]).filter(e=>e.id!==id)}));
    try{
      const{error}=await SUPA.from("ot_entries").delete().eq("id",id);

    }catch(e){
      console.error("delete error",e);
      loadAll();

    setSyncing(true);

      <div style={{color:"#1565C0",fontSize:14,fontWeight:500}}>ກຳລັງໂຫລດຂໍ້ມູນ...</div>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  return(
    <div style={{display:"flex",height:"100vh",background:"#EEF2F7",overflow:"hidden"}}>
      {/* Mobile overlay */}
      {isMob&&sideOpen&&(
        <div onClick={()=>setSideOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:200}}/>
      )}

      {/* ══ SIDEBAR — HRMS BLUE STYLE ══ */}
      <div style={{
        width:240,
        background:"linear-gradient(180deg,#1565C0 0%,#1976D2 60%,#1E88E5 100%)",
        display:"flex",flexDirection:"column",flexShrink:0,
        boxShadow:"3px 0 12px rgba(21,101,192,.25)",
        ...(isMob?{position:"fixed",top:0,left:0,height:"100vh",zIndex:210,transition:"transform .25s",transform:sideOpen?"translateX(0)":"translateX(-100%)"}:{})
      }}>

        {/* ── User profile top ── */}

                <div style={{flex:1}}>
                  <label style={{display:"block",fontSize:11,color:"#1565C0",fontWeight:500,marginBottom:5}}>ກົດເຂົ້າ (ເຊົ້າ)</label>
                  <input type="time" value={form.clockIn} onChange={e=>setForm(f=>({...f,clockIn:e.target.value}))}
                    style={{width:"100%",padding:"10px 12px",border:"1px solid #E0E7EF",borderRadius:8,fontSize:13,color:"#1565C0",boxSizing:"border-box"}}/>
                </div>
              </div>
              {/* ── Row 2: ກົດອອກ ── */}
              <div style={{marginBottom:14}}>
                <label style={{display:"block",fontSize:11,color:"#1565C0",fontWeight:600,marginBottom:5}}>ກົດອອກ</label>
                <input type="time" value={form.endTime} onChange={e=>setForm(f=>({...f,endTime:e.target.value,clockOut:e.target.value}))}
                  style={{width:"100%",padding:"10px 12px",border:"2px solid #1565C0",borderRadius:8,fontSize:13,color:"#1565C0",fontWeight:500,boxSizing:"border-box"}}/>
              </div>
{pt>0&&(
                <div style={{background:OW,borderLeft:"3px solid #1E88E5",borderRadius:"0 6px 6px 0",padding:"10px 12px",marginBottom:13}}>
                  <div style={{fontSize:11,color:GR,marginBottom:3}}>ສະຫຼຸບ OT ວັນນີ້</div>
                  <div style={{fontSize:18,fontWeight:500,color:N,marginBottom:7}}>{toS(pt)} ຊົ່ວໂມງ</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                    {BANDS.map((b,i)=>pb[i]>0&&(
                      <span key={i} style={{
                        background:i>=2?"#E8F5E9":"#E3F2FD",
                        border:`1px solid ${i>=2?"#66BB6A":"#1E88E5"}`,
                        color:i>=2?"#1B5E20":"#0D47A1",
                        fontSize:11,padding:"3px 9px",borderRadius:10,fontWeight:500}}>
                        {b.l}: {toS(pb[i])}
                      </span>
                    ))}
                  </div>
                </div>
              )}
              {/* remarks */}
              <div style={{marginBottom:16}}>
                <label style={{display:"block",fontSize:12,color:N,fontWeight:500,marginBottom:4}}>ໝາຍເຫດ</label>
                <input type="text" placeholder="(ຖ້າມີ)" value={form.remarks}
                  onChange={e=>setForm(f=>({...f,remarks:e.target.value}))}
                  style={{width:"100%",padding:isMob?"12px 12px":"8px 10px",border:`1px solid ${LG}`,borderRadius:8,fontSize:13,color:N}}/>
              </div>
              <div style={{display:"flex",justifyContent:isMob?"stretch":"flex-end",gap:8}}>
                <button onClick={()=>setShowAdd(false)} style={{padding:isMob?"12px 20px":"8px 15px",background:"transparent",border:`1px solid ${LG}`,borderRadius:8,fontSize:13,color:GR,flex:isMob?1:"auto"}}>ຍົກເລີກ</button>
                <button onClick={saveEntry} style={{padding:isMob?"12px 20px":"8px 20px",background:"linear-gradient(135deg,#1565C0,#1E88E5)",border:"none",borderRadius:8,fontSize:13,color:W,fontWeight:500,boxShadow:"0 2px 6px rgba(21,101,192,.35)",flex:isMob?2:"auto"}}>ບັນທຶກ OT</button>
              </div>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
