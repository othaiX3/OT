<script type="text/babel">
const {useState,useEffect}=React;

// HRMS Blue theme
const N="#1565C0",  // primary blue (sidebar)
      N2="#1976D2", // sidebar hover
      N3="#1E88E5", // lighter blue
      G="#1E88E5",  // accent (was gold, now blue)
      GL="#BBDEFB", // light blue
      GP="#E3F2FD", // pale blue
      W="#fff",
      OW="#F5F8FF", // off-white with blue tint
      GR="#78909C",
      LG="#E0E7EF",
      NM="#1976D2",
      WE_BG="#E8F5E9", // weekend: light green
      WE_BD="#66BB6A"; // weekend border green
// Note: N used as string below
const Nc="#1565C0";

const toM=t=>{if(!t)return 0;const[h,m]=t.split(":").map(Number);return h*60+(m||0)};
const toS=m=>{if(!m||m<=0)return"";const h=Math.floor(m/60),n=Math.round(m%60);return`${h}:${n.toString().padStart(2,"0")}`};

/*
  4 ຊ່ວງ OT:
  [0] 17:30–22:00  → ທຸກວັນ (ຈັນ–ສຸກ ແລະ ເສົາ–ອາທິດ)
  [1] 22:00–06:00  → ທຸກວັນ
  [2] 08:00–12:00  → ເສົາ–ອາທິດ ເທົ່ານັ້ນ
  [3] 12:00–17:00  → ເສົາ–ອາທິດ ເທົ່ານັ້ນ
*/
const BANDS=[
  {l:"17:30–22:00", s:17*60+30, e:22*60,        wk:true,  we:true },
  {l:"22:00–06:00", s:22*60,    e:24*60+6*60,   wk:true,  we:true },
  {l:"08:00–12:00", s:8*60,     e:12*60,        wk:false, we:true },
  {l:"12:00–17:00", s:12*60,    e:17*60,        wk:false, we:true },
];

const isWE=d=>[0,6].includes(new Date(d).getDay());

function calcBands(s0,e0,dateStr){
  if(!s0||!e0)return[0,0,0,0];
  const we=dateStr?isWE(dateStr):false;
  const s=toM(s0);let e=toM(e0);
  // ຂ້າມຄືນ: ສະເພາະ start >= 12:00 (ອາທຽນ/ແລງ) ເທົ່ານັ້ນ
  // ຖ້າ start < 12:00 ແລ້ວ end < start = input ຜິດ → ໄດ້ 0
  if(e<s && s>=12*60 && e<12*60) e+=1440;
  return BANDS.map(b=>{
    if(we?!b.we:!b.wk)return 0;
    const o1=Math.max(0,Math.min(e,b.e)-Math.max(s,b.s));
    const o2=Math.max(0,Math.min(e,b.e+1440)-Math.max(s,b.s+1440));
    return o1+o2;
  });
}

const DAYS=["ອາທິດ","ຈັນ","ອັງຄານ","ພຸດ","ພະຫັດ","ສຸກ","ເສົາ"];
const MONTHS=["ມັງກອນ","ກຸມພາ","ມີນາ","ເມສາ","ພຶດສະພາ","ມິຖຸນາ","ກໍລະກົດ","ສິງຫາ","ກັນຍາ","ຕຸລາ","ພະຈິກ","ທັນວາ"];
const dayL=d=>DAYS[new Date(d).getDay()];
const fmtD=d=>{const t=new Date(d);return`${t.getDate()}/${t.getMonth()+1}/${t.getFullYear()}`};
const ini=n=>n.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase().substring(0,2);

async function exportXL(emp,all,mo,yr){
  const rows=(all[emp.id]||[])
    .filter(e=>{const d=new Date(e.date);return d.getMonth()===mo&&d.getFullYear()===yr})
    .sort((a,b)=>new Date(a.date)-new Date(b.date));

  const wb=new ExcelJS.Workbook();
  wb.creator="LDB OT System";
  const ws=wb.addWorksheet("OT");

  // ── Colours (ARGB: FF + hex) ───────────────────────
  const C={
    navy:"FF0B2B5C", navyMid:"FF143470", gold:"FFC8A415",
    white:"FFFFFFFF", offWhite:"FFF7F5EE", gray:"FFCCCCCC",
    green:"FF1A4A1A",
    weBg:"FFFFFBEC",  weAlt:"FFFFF5D6",
    totBg:"FFFDFAF0", totWE:"FFFFF9E6",
    bandBlue:"FFEBF3FF", bandGold:"FFFFF3CC",
    naCell:"FFF0F0F0", lightGray:"FFDDDDDD",
    amber:"FF7A5C00", darkNavy:"FF3D2A00",
  };

  // ── Helper: style a cell ────────────────────────────
  const sc=(cell,fg,bg,bold,sz,halign,wrapText,borderColor,borderTop)=>{
    cell.font={name:"Phetsarath OT",bold:!!bold,size:sz||10,color:{argb:fg||C.navy}};
    cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:bg||C.white}};
    cell.alignment={horizontal:halign||"center",vertical:"middle",wrapText:!!wrapText};
    const thin=(argb)=>({style:"thin",color:{argb}});
    const med =(argb)=>({style:"medium",color:{argb}});
    const bc=borderColor||C.lightGray;
    cell.border={
      top:   borderTop?med(borderTop):thin(bc),
      bottom:borderTop?med(borderTop):thin(bc),
      left:  thin(bc), right: thin(bc)
    };
  };

  // ── Column widths ───────────────────────────────────
  ws.columns=[
    {width:13},{width:9},{width:10},{width:10},{width:10},
    {width:13},{width:13},{width:16},{width:16},{width:18}
  ];

  // ── HEADER (ແຖວ 1-4) ────────────────────────────────
  const hdrTexts=[
    "ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ",
    "ສັນຕິພາບ ເອກະລາດ ປະຊາທິປະໄຕ ເອກະພາບ ວັດທະນາຖາວອນ",
    `ສໍາຊອນການເຮັດລ່ວງເວລາຂອງພະນັກງານ ທ່ານ ${emp.name}`,
    `ເດືອນ ${MONTHS[mo]} ປີ ${yr}`,
  ];
  hdrTexts.forEach((txt,i)=>{
    const r=ws.addRow([txt]);
    r.height=i%2===0?22:17;
    ws.mergeCells(i+1,1,i+1,10);
    const bold=i===0||i===2, bg=i%2===0?C.white:C.offWhite;
    sc(r.getCell(1),C.navy,bg,bold,i===2?12:11,"center",false,C.lightGray);
    // fill remaining merged cells too
    for(let c=2;c<=10;c++) sc(r.getCell(c),C.navy,bg,bold,11,"center",false,C.lightGray);
  });

  // ── Gap row (ແຖວ 5) ─────────────────────────────────
  const gap=ws.addRow([]);
  gap.height=5;
  ws.mergeCells(5,1,5,10);
  for(let c=1;c<=10;c++){ const cell=gap.getCell(c); cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:C.white}}; cell.border={top:{style:"thin",color:{argb:C.white}},bottom:{style:"thin",color:{argb:C.white}},left:{style:"thin",color:{argb:C.white}},right:{style:"thin",color:{argb:C.white}}}; }

  // ── COLUMN HEADERS (ແຖວ 6) ──────────────────────────
  const heads=["ວັນທີ","ວັນ","ເລີ່ມ OT","ອອກ","ລວມ","17:30-22:00","22:00-06:00","08:00-12:00\n(ເສົາ-ອາທິດ)","12:00-17:00\n(ເສົາ-ອາທິດ)","ໝາຍເຫດ"];
  const colHdr=ws.addRow(heads);
  colHdr.height=38;
  heads.forEach((_,ci)=>{
    const cell=colHdr.getCell(ci+1);
    const isWE=ci>=7;
    cell.font={name:"Phetsarath OT",bold:true,size:10,color:{argb:C.white}};
    cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:isWE?C.green:C.navy}};
    cell.alignment={horizontal:"center",vertical:"middle",wrapText:true};
    cell.border={
      top:{style:"medium",color:{argb:C.gold}},
      bottom:{style:"medium",color:{argb:C.gold}},
      left:{style:"thin",color:{argb:C.white}},
      right:{style:"thin",color:{argb:C.white}}
    };
  });

  // ── DATA ROWS ────────────────────────────────────────
  const tb=[0,0,0,0]; let tm=0;
  rows.forEach((r,ri)=>{
    const b=calcBands(r.startTime,r.endTime,r.date);
    const tot=b.reduce((a,x)=>a+x,0);
    const we=isWE(r.date);
    tm+=tot; b.forEach((x,i)=>tb[i]+=x);
    const alt=ri%2!==0;
    const rowBg=we?(alt?C.weAlt:C.weBg):(alt?C.offWhite:C.white);
    const tc=we?C.amber:C.navy;
    const bc=we?"FFE8C84A":C.lightGray;

    const dr=ws.addRow([
      fmtD(r.date), dayL(r.date), r.startTime, r.endTime, toS(tot)||"",
      toS(b[0])||"", toS(b[1])||"",
      we?(toS(b[2])||""):"—", we?(toS(b[3])||""):"—",
      r.remarks||""
    ]);
    dr.height=20;

    // col 1: date
    sc(dr.getCell(1),tc,rowBg,true,10,"left",false,bc);
    // col 2: day
    sc(dr.getCell(2),we?C.amber:C.navyMid,rowBg,false,10,"left",false,bc);
    // cols 3-4: times
    [3,4].forEach(c=>sc(dr.getCell(c),tc,rowBg,false,10,"center",false,bc));
    // col 5: total
    sc(dr.getCell(5),tc,rowBg,true,11,"center",false,bc);
    // col 6: band 0
    sc(dr.getCell(6),b[0]>0?C.navyMid:C.gray, b[0]>0?C.bandBlue:rowBg, b[0]>0,10,"center",false,bc);
    // col 7: band 1
    sc(dr.getCell(7),b[1]>0?C.navyMid:C.gray, b[1]>0?C.bandBlue:rowBg, b[1]>0,10,"center",false,bc);
    // col 8: band 2 (WE only)
    if(we) sc(dr.getCell(8),b[2]>0?C.amber:C.gray, b[2]>0?C.bandGold:rowBg, b[2]>0,10,"center",false,"FFE8C84A");
    else { const cell=dr.getCell(8); cell.value="—"; cell.font={name:"Phetsarath OT",size:10,color:{argb:C.gray}}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:C.naCell}}; cell.alignment={horizontal:"center",vertical:"middle"}; cell.border={top:{style:"thin",color:{argb:C.lightGray}},bottom:{style:"thin",color:{argb:C.lightGray}},left:{style:"thin",color:{argb:C.lightGray}},right:{style:"thin",color:{argb:C.lightGray}}}; }
    // col 9: band 3 (WE only)
    if(we) sc(dr.getCell(9),b[3]>0?C.amber:C.gray, b[3]>0?C.bandGold:rowBg, b[3]>0,10,"center",false,"FFE8C84A");
    else { const cell=dr.getCell(9); cell.value="—"; cell.font={name:"Phetsarath OT",size:10,color:{argb:C.gray}}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:C.naCell}}; cell.alignment={horizontal:"center",vertical:"middle"}; cell.border={top:{style:"thin",color:{argb:C.lightGray}},bottom:{style:"thin",color:{argb:C.lightGray}},left:{style:"thin",color:{argb:C.lightGray}},right:{style:"thin",color:{argb:C.lightGray}}}; }
    // col 10: remarks
    sc(dr.getCell(10),tc,rowBg,false,10,"left",false,bc);
  });

  // ── TOTAL ROW ────────────────────────────────────────
  const totRow=ws.addRow(["ລວມທັງໝົດ","","","",toS(tm)||"0:00",toS(tb[0])||"0:00",toS(tb[1])||"0:00",toS(tb[2])||"0:00",toS(tb[3])||"0:00",""]);
  totRow.height=22;
  ws.mergeCells(totRow.number,1,totRow.number,4);
  const totBorder=(we2)=>({top:{style:"medium",color:{argb:C.gold}},bottom:{style:"medium",color:{argb:C.gold}},left:{style:"thin",color:{argb:C.lightGray}},right:{style:"thin",color:{argb:C.lightGray}}});
  [1,2,3,4].forEach(c=>{const cell=totRow.getCell(c);cell.font={name:"Phetsarath OT",bold:true,size:11,color:{argb:C.navy}};cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:C.totBg}};cell.alignment={horizontal:c===1?"right":"center",vertical:"middle"};cell.border=totBorder();});
  [5,6,7].forEach(c=>{const cell=totRow.getCell(c);cell.font={name:"Phetsarath OT",bold:true,size:11,color:{argb:C.navy}};cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:C.totBg}};cell.alignment={horizontal:"center",vertical:"middle"};cell.border=totBorder();});
  [8,9].forEach(c=>{const cell=totRow.getCell(c);cell.font={name:"Phetsarath OT",bold:true,size:11,color:{argb:C.amber}};cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:C.totWE}};cell.alignment={horizontal:"center",vertical:"middle"};cell.border=totBorder();});
  {const cell=totRow.getCell(10);cell.font={name:"Phetsarath OT",bold:true,size:11,color:{argb:C.navy}};cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:C.totBg}};cell.alignment={horizontal:"center",vertical:"middle"};cell.border=totBorder();}

  // ── Gap row ──────────────────────────────────────────
  const gap2=ws.addRow([]);gap2.height=6;
  ws.mergeCells(gap2.number,1,gap2.number,10);
  for(let c=1;c<=10;c++){const cell=gap2.getCell(c);cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:C.white}};cell.border={top:{style:"thin",color:{argb:C.white}},bottom:{style:"thin",color:{argb:C.white}},left:{style:"thin",color:{argb:C.white}},right:{style:"thin",color:{argb:C.white}}};}

  // ── SIGNATURE ROW ────────────────────────────────────
  const sigRow=ws.addRow(["ຜູ້ລາຍງານ: ..............................  ວັນທີ: ..........","","","","","ຫົວໜ້າໜ່ວຍ: ...............................","","","ຜູ້ອໍານວຍການ: ...............................",""])
  sigRow.height=28;
  ws.mergeCells(sigRow.number,1,sigRow.number,4);
  ws.mergeCells(sigRow.number,6,sigRow.number,8);
  ws.mergeCells(sigRow.number,9,sigRow.number,10);
  for(let c=1;c<=10;c++){const cell=sigRow.getCell(c);cell.font={name:"Phetsarath OT",size:10,color:{argb:C.navy}};cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:C.offWhite}};cell.alignment={horizontal:"left",vertical:"middle"};cell.border={top:{style:"thin",color:{argb:C.lightGray}},bottom:{style:"thin",color:{argb:C.lightGray}},left:{style:"thin",color:{argb:C.lightGray}},right:{style:"thin",color:{argb:C.lightGray}}};}

  // ── Export ───────────────────────────────────────────

  // footer gap
  const gap3=ws.addRow([]);gap3.height=8;
  ws.mergeCells(gap3.number,1,gap3.number,10);
  for(let c=1;c<=10;c++){const cell=gap3.getCell(c);cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFFFF'}};cell.border={top:{style:'thin',color:{argb:'FFFFFFFF'}},bottom:{style:'thin',color:{argb:'FFFFFFFF'}},left:{style:'thin',color:{argb:'FFFFFFFF'}},right:{style:'thin',color:{argb:'FFFFFFFF'}}};}

  // FOOTER 1: contact (white)
  const ftC=ws.addRow(['  www.ldblao.la          ldblaoho@ldblao.la          LDB Bank          LDBBLALA','','','','','','','','','']);
  ftC.height=22;ws.mergeCells(ftC.number,1,ftC.number,10);
  for(let c=1;c<=10;c++){const cell=ftC.getCell(c);cell.font={name:'Arial',size:10,color:{argb:'FF0066AA'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFFFF'}};cell.alignment={horizontal:'center',vertical:'middle'};cell.border={top:{style:'medium',color:{argb:'FF0099CC'}},bottom:{style:'thin',color:{argb:'FFB0D8F0'}},left:{style:'thin',color:{argb:'FFB0D8F0'}},right:{style:'thin',color:{argb:'FFB0D8F0'}}};}

  // FOOTER 2: Lao address (blue)
  const ftL=ws.addRow(['  ທະນາຄານ ພັດທະນາລາວ ສາຂາໂພນສະຫວ່ານ,  ຕັ້ງຢູ່ ວິລະສອນ,  ເມືອງແປກ,  ແຂວງຊຽງຂວາງ,  ສປປ ລາວ','','','','','','','','','']);
  ftL.height=20;ws.mergeCells(ftL.number,1,ftL.number,10);
  for(let c=1;c<=10;c++){const cell=ftL.getCell(c);cell.font={name:'Phetsarath OT',size:10,color:{argb:'FFFFFFFF'},bold:true};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0088BB'}};cell.alignment={horizontal:'center',vertical:'middle'};cell.border={top:{style:'thin',color:{argb:'FF006699'}},bottom:{style:'thin',color:{argb:'FF006699'}},left:{style:'thin',color:{argb:'FF006699'}},right:{style:'thin',color:{argb:'FF006699'}}};}

  // FOOTER 3: English address (darker blue)
  const ftE=ws.addRow(['  Phonsavan Branch,  Vilason Road,  Phonsavang Village,  Pek District,  Xiengkhouang Province,  Lao P.D.R,  P.O box: 2700','','','','','','','','','']);
  ftE.height=20;ws.mergeCells(ftE.number,1,ftE.number,10);
  for(let c=1;c<=10;c++){const cell=ftE.getCell(c);cell.font={name:'Arial',size:9,color:{argb:'FFFFFFFF'},bold:true,italic:true};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF006699'}};cell.alignment={horizontal:'center',vertical:'middle'};cell.border={top:{style:'thin',color:{argb:'FF005588'}},bottom:{style:'medium',color:{argb:'FF004477'}},left:{style:'thin',color:{argb:'FF005588'}},right:{style:'thin',color:{argb:'FF005588'}}};}

  const buf=await wb.xlsx.writeBuffer();
  const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  const a=document.createElement("a");a.href=url;
  a.download=`OT_${emp.name}_${MONTHS[mo]}_${yr}.xlsx`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}


const INIT=[
  {id:"1",name:"ອິນທະລີ ສິນບຸກຄັນ"},{id:"2",name:"ພອນສີ ດາວໄຊເພັດ"},
  {id:"3",name:"ອໍາໄພສອນ ພັນທະວົງ"},{id:"4",name:"ວຸງໃສ ບຸນທະສິງ"},
  {id:"5",name:"ສຸລີ ຜິວພັນ"},{id:"6",name:"ແສງເພັດ ລາດພິນມາຈັນ"},
];

const Ic=({d,sz=14,c="currentColor"})=>(
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>
);
const IPlus =()=><Ic d="M12 5v14M5 12h14"/>;
const IDl   =()=><Ic d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>;
const IDel  =()=><Ic d="M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2"/>;
const IChL  =()=><Ic d="M15 18l-6-6 6-6"/>;
const IChR  =()=><Ic d="M9 18l6-6-6-6"/>;
const IX    =()=><Ic d="M18 6L6 18M6 6l12 12"/>;
const IClock=()=><Ic d="M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2"/>;
const IBar  =()=><Ic d="M18 20V10M12 20V4M6 20v-6"/>;
const IUser =()=><Ic d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 3a4 4 0 100 8 4 4 0 000-8z"/>;

function App(){
  const[emps,setEmps]=useState(()=>{try{return JSON.parse(localStorage.getItem("ldb_emps"))||INIT}catch{return INIT}});
  const[entries,setEntries]=useState(()=>{try{return JSON.parse(localStorage.getItem("ldb_ent"))||{}}catch{return{}}});
  const[sel,setSel]=useState("1");
  const[mo,setMo]=useState(new Date().getMonth());
  const[yr,setYr]=useState(new Date().getFullYear());
  const[showAdd,setShowAdd]=useState(false);
  const[showEmp,setShowEmp]=useState(false);

                          </td>
                        </tr>
                      );
                    })}
                    {/* totals */}
                    <tr>
                      <td colSpan={4} style={{padding:"9px 10px",background:"#E3F2FD",borderTop:"2px solid #1565C0",color:"#1565C0",fontWeight:600,fontSize:12,textAlign:"right",borderRight:"1px solid #BBDEFB"}}>ລວມທັງໝົດ</td>
                      <td style={{padding:"9px 9px",background:"#E3F2FD",borderTop:"2px solid #1565C0",textAlign:"center",fontWeight:600,color:"#1565C0",fontSize:13,borderRight:"1px solid #BBDEFB"}}>{toS(tmins)||"0:00"}</td>
                      {btot.map((x,i)=>(
                        <td key={i} style={{padding:"9px 9px",background:i>=2?"#E8F5E9":"#E3F2FD",borderTop:"2px solid #1565C0",textAlign:"center",fontWeight:600,color:x>0?(i>=2?"#2E7D32":"#1565C0"):"#BDBDBD",fontSize:12,borderRight:"1px solid #BBDEFB"}}>
                          {toS(x)||"—"}
                        </td>
                      ))}
                      <td colSpan={2} style={{background:"#E3F2FD",borderTop:"2px solid #1565C0"}}/>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
        {/* ── MOBILE BOTTOM BAR ── */}
        {isMob&&emp&&(
          <div style={{position:"fixed",bottom:0,left:0,right:0,background:W,borderTop:"1px solid #E0E7EF",padding:"8px 14px",display:"flex",gap:8,zIndex:100,boxShadow:"0 -2px 10px rgba(21,101,192,.1)"}}>
            <button onClick={()=>exportXL(emp,entries,mo,yr).catch(console.error)} style={{flex:1,padding:"11px",background:"#F0F4FF",border:"1px solid #BBDEFB",borderRadius:8,fontSize:13,color:"#1565C0",display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontWeight:500}}>
              <IDl/> Export Excel
            </button>
            <button onClick={()=>setShowAdd(true)} style={{flex:1,padding:"11px",background:"linear-gradient(135deg,#1565C0,#1E88E5)",border:"none",borderRadius:8,fontSize:13,color:W,display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontWeight:600,boxShadow:"0 2px 8px rgba(21,101,192,.35)"}}>
              <IPlus/> ເພີ່ມ OT
            </button>
          </div>
        )}
      </div>

      {/* MODAL: ADD ENTRY */}
      {showAdd&&(
        <div style={{position:"fixed",inset:0,background:"rgba(21,101,192,.45)",display:"flex",alignItems:isMob?"flex-end":"center",justifyContent:"center",zIndex:300}}>
          <div style={{background:W,borderRadius:isMob?"16px 16px 0 0":"10px",border:`1px solid ${LG}`,width:isMob?"100%":430,maxWidth:isMob?"100%":"95vw",overflow:"hidden",maxHeight:isMob?"92vh":"none",display:"flex",flexDirection:"column"}}>
            {isMob&&<div style={{display:"flex",justifyContent:"center",padding:"10px 0 0",background:W}}>
              <div style={{width:36,height:4,borderRadius:2,background:"#CFD8DC"}}/>
            </div>}
            <div style={{background:isMob?"#F8FAFF":"linear-gradient(135deg,#1565C0,#1976D2)",padding:isMob?"12px 16px":"13px 17px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:isMob?"1px solid #E0E7EF":"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:3,height:16,background:"rgba(255,255,255,.8)",borderRadius:2}}/>
                <span style={{color:isMob?"#1565C0":W,fontSize:14,fontWeight:500}}>ເພີ່ມ OT ໃໝ່</span>
              </div>
              <button onClick={()=>setShowAdd(false)} style={{background:"none",border:"none",color:isMob?"#90A4AE":"rgba(255,255,255,.55)",padding:4}}><IX/></button>
            </div>
            <div style={{padding:isMob?"16px 16px 20px":20,overflowY:isMob?"auto":"visible",flex:isMob?1:"auto"}}>
              <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:13,fontSize:12,color:GR}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:"#1E88E5"}}/>
                {emp?.name}
              </div>
              {/* date */}
              <div style={{marginBottom:13}}>
                <label style={{display:"block",fontSize:12,color:N,fontWeight:500,marginBottom:4}}>ວັນທີ</label>
                <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}
                  style={{width:"100%",padding:isMob?"12px 12px":"8px 10px",border:`1px solid ${LG}`,borderRadius:8,fontSize:13,color:N}}/>
                {form.date&&(
                  <div style={{marginTop:6}}>
                    <span style={{fontSize:11,fontWeight:500,
                      color:formWE?"#1B5E20":"#0D47A1",
                      background:formWE?"#E8F5E9":"#E3F2FD",
                      border:`1px solid ${formWE?"#66BB6A":"#BBDEFB"}`,
                      padding:"3px 10px",borderRadius:10,display:"inline-flex",alignItems:"center",gap:5}}>
                      <span style={{width:6,height:6,borderRadius:"50%",background:formWE?G:NM,display:"inline-block"}}/>
                      {dayL(form.date)} — {formWE?"ເສົາ/ອາທິດ: ໄລ່ 4 ຊ່ວງ":"ວັນທຳມະດາ: ໄລ່ 2 ຊ່ວງ"}
                    </span>
                  </div>
                )}
              </div>
              {/* times */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:13}}>
                {[["ເລີ່ມ OT","startTime"],["ເວລາອອກ","endTime"]].map(([lbl,k])=>(
                  <div key={k}>
                    <label style={{display:"block",fontSize:12,color:N,fontWeight:500,marginBottom:4}}>{lbl}</label>
                    <input type="time" value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}
                      style={{width:"100%",padding:isMob?"12px 12px":"8px 10px",border:`1px solid ${LG}`,borderRadius:8,fontSize:13,color:N}}/>
                  </div>
                ))}
              </div>
              {/* live preview */}
              {pt>0&&(
                <div style={{background:OW,borderLeft:"3px solid #1E88E5",borderRadius:"0 6px 6px 0",padding:"10px 12px",marginBottom:13}}>
                  <div style={{fontSize:11,color:GR,marginBottom:3}}>ສະຫຼຸບ OT ວັນນີ້</div>
                  <div style={{fontSize:18,fontWeight:500,color:N,marginBottom:7}}>{toS(pt)} ຊົ່ວໂມງ</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                    {BANDS.map((b,i)=>pb[i]>0&&(
                      <span key={i} style={{
                        background:i>=2?"#E8F5E9":"#E3F2FD",
                        border:`1px solid ${i>=2?"#66BB6A":"#1E88E5"}`,
                        color:i>=2?"#1B5E20":"#0D47A1",
                        fontSize:11,padding:"3px 9px",borderRadius:10,fontWeight:500}}>
                        {b.l}: {toS(pb[i])}
                      </span>
                    ))}
                  </div>
                </div>
              )}
              {/* remarks */}
              <div style={{marginBottom:16}}>
                <label style={{display:"block",fontSize:12,color:N,fontWeight:500,marginBottom:4}}>ໝາຍເຫດ</label>
                <input type="text" placeholder="(ຖ້າມີ)" value={form.remarks}
                  onChange={e=>setForm(f=>({...f,remarks:e.target.value}))}
                  style={{width:"100%",padding:isMob?"12px 12px":"8px 10px",border:`1px solid ${LG}`,borderRadius:8,fontSize:13,color:N}}/>
              </div>
              <div style={{display:"flex",justifyContent:isMob?"stretch":"flex-end",gap:8}}>
                <button onClick={()=>setShowAdd(false)} style={{padding:isMob?"12px 20px":"8px 15px",background:"transparent",border:`1px solid ${LG}`,borderRadius:8,fontSize:13,color:GR,flex:isMob?1:"auto"}}>ຍົກເລີກ</button>
                <button onClick={saveEntry} style={{padding:isMob?"12px 20px":"8px 20px",background:"linear-gradient(135deg,#1565C0,#1E88E5)",border:"none",borderRadius:8,fontSize:13,color:W,fontWeight:500,boxShadow:"0 2px 6px rgba(21,101,192,.35)",flex:isMob?2:"auto"}}>ບັນທຶກ OT</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: ADD EMPLOYEE */}
      {showEmp&&(
        <div style={{position:"fixed",inset:0,background:"rgba(21,101,192,.45)",display:"flex",alignItems:isMob?"flex-end":"center",justifyContent:"center",zIndex:300}}>
          <div style={{background:W,borderRadius:isMob?"16px 16px 0 0":"10px",border:`1px solid ${LG}`,width:isMob?"100%":340,overflow:"hidden"}}>
            {isMob&&<div style={{display:"flex",justifyContent:"center",padding:"10px 0 0",background:W}}>
              <div style={{width:36,height:4,borderRadius:2,background:"#CFD8DC"}}/>
            </div>}
            <div style={{background:isMob?"#F8FAFF":"linear-gradient(135deg,#1565C0,#1976D2)",padding:isMob?"12px 16px":"13px 17px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:isMob?"1px solid #E0E7EF":"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:3,height:16,background:"rgba(255,255,255,.8)",borderRadius:2}}/>
                <span style={{color:isMob?"#1565C0":W,fontSize:14,fontWeight:500}}>ເພີ່ມພະນັກງານ</span>
              </div>
              <button onClick={()=>setShowEmp(false)} style={{background:"none",border:"none",color:isMob?"#90A4AE":"rgba(255,255,255,.55)",padding:4}}><IX/></button>
            </div>
            <div style={{padding:20}}>
              <div style={{marginBottom:16}}>
                <label style={{display:"block",fontSize:12,color:N,fontWeight:500,marginBottom:4}}>ຊື່ ແລະ ນາມສະກຸນ</label>
                <input type="text" placeholder="ຊື່ ນາມສະກຸນ..." value={empN}
                  onChange={e=>setEmpN(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&addEmp()}
                  autoFocus
                  style={{width:"100%",padding:isMob?"13px 14px":"9px 12px",border:`1px solid ${LG}`,borderRadius:8,fontSize:13,color:N}}/>
              </div>
              <div style={{display:"flex",justifyContent:isMob?"stretch":"flex-end",gap:8}}>
                <button onClick={()=>setShowEmp(false)} style={{padding:isMob?"12px 20px":"8px 14px",background:"transparent",border:`1px solid ${LG}`,borderRadius:8,fontSize:13,color:GR,flex:isMob?1:"auto"}}>ຍົກເລີກ</button>
                <button onClick={addEmp} style={{padding:isMob?"12px 20px":"8px 20px",background:"linear-gradient(135deg,#1565C0,#1E88E5)",border:"none",borderRadius:8,fontSize:13,color:W,fontWeight:500,flex:isMob?2:"auto"}}>ເພີ່ມ</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
